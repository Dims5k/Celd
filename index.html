<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Examen blanc CE1D maths et sciences pour la 2e secondaire (Fédération Wallonie-Bruxelles). Nouvelles questions à chaque examen.">
<style>html{color-scheme:light}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Examen blanc CE1D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout : une feuille de cahier quadrillé ; une question par feuille ; la correction arrive au stylo rouge. */
:root{
  --paper:#F7F9FB; --grid:#DCE6F0; --card:#FFFFFF; --fg:#1F242D; --muted:#5B6574; --line:#C9D3DE;
  --ink:#1D43A8; --ink-soft:#E3EAFB; --red:#C4302A; --red-soft:#FBE7E5; --ok:#1E7A45; --ok-soft:#E1F3E8; --hl:#F4DC5B;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-hand:"Caveat", "Comic Sans MS", cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#12161D; --grid:#1C2330; --card:#181E27; --fg:#E6EAF0; --muted:#98A3B3; --line:#2E3847;
  --ink:#8FB0FF; --ink-soft:#1E2A45; --red:#FF7B70; --red-soft:#3A1F1E; --ok:#6FD39A; --ok-soft:#173226; --hl:#E8C93A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12161D; --grid:#1C2330; --card:#181E27; --fg:#E6EAF0; --muted:#98A3B3; --line:#2E3847;
  --ink:#8FB0FF; --ink-soft:#1E2A45; --red:#FF7B70; --red-soft:#3A1F1E; --ok:#6FD39A; --ok-soft:#173226; --hl:#E8C93A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--fg);font-family:var(--f-body);font-size:17px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;padding-inline:16px;padding-block:0 48px;min-height:100vh}
.wrap{max-width:860px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* barre du haut */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:2px solid var(--fg);
  display:flex;align-items:center;gap:12px;padding-block:12px;margin-bottom:24px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--muted);letter-spacing:.02em}
.top .spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:3px 10px;border:1.5px solid var(--line);border-radius:999px;background:var(--card);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.ink{border-color:var(--ink);color:var(--ink)}

/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--fg);background:var(--card);padding:10px 18px;border-radius:10px;font-weight:700;min-height:46px}
.btn:hover{background:var(--ink-soft)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--card)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:var(--line)}
.btn.small{padding:6px 12px;min-height:36px;font-size:15px;border-width:1.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* accueil */
.hero{display:grid;gap:10px;margin-bottom:28px}
.hero h1{font-size:clamp(34px,6vw,54px);font-weight:800;letter-spacing:-.02em}
.hero h1 mark{background:linear-gradient(transparent 55%,var(--hl) 55%);color:inherit;padding:0 4px}
.hero p{margin:0;color:var(--muted);max-width:60ch}
.label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 10px}
.subjects{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:22px}
.subj{text-align:left;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:16px;display:grid;gap:6px;min-width:0}
.subj b{font-family:var(--f-display);font-size:21px}
.subj span{font-size:14px;color:var(--muted)}
.subj[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--ink-soft)}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);flex-wrap:wrap}
.seg button{border:0;background:none;padding:9px 16px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.startrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:34px}
.cols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.panel h2{font-size:19px;margin-bottom:12px}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.hist li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.hist li:last-child{border-bottom:0}
.hist .s{font-family:var(--f-hand);font-size:26px;color:var(--red);line-height:1;grid-row:span 2;align-self:center}
.hist small{color:var(--muted)}
.empty{color:var(--muted);font-size:15px;margin:0}
.bar{height:10px;border-radius:5px;background:var(--grid);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink)}
.bar.low i{background:var(--red)}
.themes{display:grid;gap:10px}
.themes .row{display:grid;grid-template-columns:minmax(0,1fr) 54px;gap:4px 10px;align-items:center;font-size:15px}
.themes .row .bar{grid-column:1 / -1}
.themes .row em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.note{font-size:14px;color:var(--muted);margin-top:18px}
.note a{color:var(--ink)}
.resume{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--hl);color:#1F242D;border-radius:12px;padding:12px 16px;margin-bottom:22px;font-weight:700}
.resume .btn{border-color:#1F242D;background:#fff;color:#1F242D}

/* examen */
.sheet{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:22px;position:relative;min-width:0}
.qhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.qnum{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.01em}
.qnum small{font-size:15px;color:var(--muted);font-weight:600}
.qhead .spacer{flex:1}
.prompt{font-size:18px;max-width:68ch}
.prompt p{margin:0 0 10px}
.prompt .expr{font-size:21px;font-variant-numeric:tabular-nums;background:var(--ink-soft);border-radius:8px;padding:8px 14px;display:inline-block;margin:4px 0 8px;letter-spacing:.01em}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.05;margin:0 2px;font-size:.92em}
.frac > span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
.frac > span:last-child{padding:0 3px}
table.doc{border-collapse:collapse;margin:6px 0 12px;font-size:16px;font-variant-numeric:tabular-nums}
table.doc th,table.doc td{border:1.5px solid var(--line);padding:6px 12px;text-align:center}
table.doc th{background:var(--ink-soft);font-weight:700}
.tablewrap{overflow-x:auto;max-width:100%}
.fig{margin:6px 0 14px;max-width:100%}
.fig svg{max-width:100%;height:auto;display:block}
.fig .s{stroke:var(--fg);stroke-width:2;fill:none}
.fig .f{fill:var(--ink-soft);stroke:var(--fg);stroke-width:2}
.fig .d{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4;fill:none}
.fig .g{stroke:var(--grid);stroke-width:1}
.fig .c{stroke:var(--ink);stroke-width:3;fill:none}
.fig text{fill:var(--fg);font-family:var(--f-body);font-size:15px}
.fig text.m{fill:var(--muted);font-size:12px}
.fig text.u{fill:var(--red);font-weight:700}
.answer{margin-top:18px;display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;background:var(--card);cursor:pointer}
.opt:hover{border-color:var(--ink)}
.opt input{margin-top:5px;accent-color:var(--ink);width:18px;height:18px;flex:none}
.opt.on{border-color:var(--ink);background:var(--ink-soft)}
.field{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.field label{min-width:0;font-weight:700}
.field input{border:none;border-bottom:2px solid var(--ink);background:transparent;padding:6px 4px;font-size:20px;color:var(--ink);width:min(260px,100%);font-variant-numeric:tabular-nums}
.field input.wide{width:min(420px,100%)}
.field .suf{color:var(--muted)}
.hint{font-size:14px;color:var(--muted);margin:0}
.match{display:grid;gap:8px}
.match .mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center;border-bottom:1px dashed var(--line);padding-bottom:8px}
select{border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card);width:100%}
.order{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.order li{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card)}
.order li .n{font-family:var(--f-display);font-weight:800;color:var(--ink);width:22px;text-align:center}
.order li .t{flex:1;min-width:0}
.order li button{border:1.5px solid var(--line);background:var(--card);border-radius:8px;width:38px;height:36px;display:grid;place-items:center}
textarea{width:100%;min-height:170px;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--card);line-height:1.6;resize:vertical;
  background-image:linear-gradient(transparent calc(1.6em - 1px),var(--grid) 1px);background-size:100% 1.6em;background-attachment:local}
.nav{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:22px;flex-wrap:wrap}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.dot{width:36px;height:36px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.dot.done{background:var(--ink-soft);border-color:var(--ink);color:var(--ink)}
.dot.cur{outline:3px solid var(--fg);outline-offset:1px}
.listen{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.confirm{margin-top:18px;border:2px solid var(--red);border-radius:12px;padding:16px;background:var(--red-soft);display:grid;gap:12px}

/* résultats */
.score{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px 26px;align-items:center;margin-bottom:24px}
.bigscore{font-family:var(--f-hand);color:var(--red);font-size:clamp(64px,12vw,96px);line-height:.9;transform:rotate(-4deg);padding:6px 10px;border:3px solid var(--red);border-radius:50% 46% 52% 44%;text-align:center;min-width:150px}
.bigscore small{display:block;font-size:.34em}
.verdict h2{font-size:26px;margin-bottom:6px}
.verdict p{margin:0;color:var(--muted)}
.status{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:10px;background:var(--ink-soft);margin-bottom:18px;font-size:15px}
.spin{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--ink);border-right-color:transparent;animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.review{display:grid;gap:14px;margin-top:22px}
.rq{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:10px;min-width:0}
.rq.bad{border-left:5px solid var(--red)}
.rq.good{border-left:5px solid var(--ok)}
.rq.part{border-left:5px solid var(--hl)}
.rq .top2{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.rq .pts{font-family:var(--f-hand);font-size:28px;color:var(--red);line-height:1;margin-left:auto}
.rq .prompt{font-size:16px}
.rq .prompt .expr{font-size:17px}
.ans{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.ans > div{border-radius:10px;padding:10px 12px;min-width:0;overflow-wrap:anywhere}
.ans .mine{background:var(--paper);border:1px solid var(--line)}
.ans .right{background:var(--ok-soft)}
.ans h4{margin:0 0 4px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ans ul{margin:0;padding-left:18px}
.redpen{font-family:var(--f-hand);color:var(--red);font-size:23px;line-height:1.25;margin:0}
.explain{font-size:15px;color:var(--fg);background:var(--paper);border-radius:10px;padding:10px 12px}
.explain b{color:var(--ink)}
.ai{font-size:15px;white-space:pre-wrap;border-left:3px solid var(--ink);padding:6px 12px;margin:0}
.self{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:15px}
.self button[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.ok{color:var(--ok);font-weight:700}.ko{color:var(--red);font-weight:700}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:26px}
@media (max-width:720px){
  .subjects{grid-template-columns:1fr}
  .cols{grid-template-columns:1fr}
  .sheet{padding:16px}
  .ans{grid-template-columns:1fr}
  .score{grid-template-columns:1fr;justify-items:start}
  .match .mrow{grid-template-columns:1fr}
  body{font-size:16px}
}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Examen blanc CE1D <small>2e secondaire</small></div>
    <div class="spacer"></div>
    <div id="topinfo" style="display:flex;gap:8px;flex-wrap:wrap"></div>
  </header>
  <main id="app"></main>
</div>

<script>
(() => {
"use strict";
/* ============ utilitaires ============ */
const $ = (s, r = document) => r.querySelector(s);
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const nz = (a, b) => { let n; do n = ri(a, b); while (n === 0); return n; };
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const MIN = "−";
function fmt(n, dec = 2) {
  const p = Math.pow(10, dec); let v = Math.round(n * p) / p; if (Object.is(v, -0)) v = 0;
  let s = String(Math.abs(v)).replace(".", ",");
  const [i, d] = s.split(","); const ii = i.length > 4 ? i.replace(/\B(?=(\d{3})+(?!\d))/g, " ") : i;
  s = d ? ii + "," + d : ii;
  return (v < 0 ? MIN : "") + s;
}
const rel = n => n < 0 ? "(" + fmt(n) + ")" : fmt(n);
const frac = (a, b) => `<span class="frac"><span>${a}</span><span>${b}</span></span>`;
const fracTxt = (n, d) => { if (d < 0) { n = -n; d = -d; } const g = gcd(n, d); n /= g; d /= g; return d === 1 ? fmt(n) : (n < 0 ? MIN : "") + Math.abs(n) + "/" + d; };
const sup = { 2: "²", 3: "³" };
function polyStr(terms, v = "x") { // terms: [[coef, pow], ...]
  const t = terms.filter(([c]) => c !== 0).sort((a, b) => b[1] - a[1]);
  if (!t.length) return "0";
  return t.map(([c, p], i) => {
    const neg = c < 0, a = Math.abs(c);
    const body = p === 0 ? fmt(a) : (a === 1 ? "" : fmt(a)) + v + (p > 1 ? (sup[p] || "^" + p) : "");
    return i === 0 ? (neg ? MIN : "") + body : (neg ? " " + MIN + " " : " + ") + body;
  }).join("");
}
const signed = n => n < 0 ? " " + MIN + " " + fmt(-n) : " + " + fmt(n);
let uid = 0; const gid = p => p + "-" + Date.now().toString(36) + "-" + (uid++);

/* ============ lecture des réponses ============ */
function norm(s) {
  return String(s || "").trim().replace(/[−–—]/g, "-").replace(/,/g, ".").replace(/\s+/g, "")
    .replace(/[×·]/g, "*").replace(/[÷:]/g, "/").replace(/²/g, "^2").replace(/³/g, "^3");
}
function parseNumber(s) {
  let t = norm(s).replace(/^[a-z]=/i, "").replace(/[a-zé°%€³²]+$/i, "").replace(/(cm|dm|km|mm|m|l|ml|g|kg|min|s|h)(\^\d)?$/i, "");
  if (!t) return NaN;
  let m = t.match(/^(-?\d*\.?\d+)\/(-?\d*\.?\d+)$/);
  if (m) return Number(m[1]) / Number(m[2]);
  if (/^[-+]?\d*\.?\d+$/.test(t)) return Number(t);
  return NaN;
}
function parseSci(s) {
  const t = norm(s).replace(/⁻/g, "-").replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]/g, c => "⁰¹²³⁴⁵⁶⁷⁸⁹".indexOf(c));
  const m = t.match(/^(-?\d+(?:\.\d+)?)(?:\*|x|\.)10\^?\(?(-?\d+)\)?$/i);
  if (!m) return null;
  return { mant: Number(m[1]), exp: Number(m[2]), val: Number(m[1]) * Math.pow(10, Number(m[2])) };
}
// mini-analyseur d'expressions littérales (une variable)
function parseExpr(src, v) {
  const s = norm(src).replace(/\^\(?(-?\d+)\)?/g, "^$1").toLowerCase();
  const toks = []; let i = 0;
  while (i < s.length) {
    const c = s[i];
    if (/[\d.]/.test(c)) { let j = i; while (j < s.length && /[\d.]/.test(s[j])) j++; toks.push({ t: "n", v: Number(s.slice(i, j)) }); i = j; continue; }
    if (c === v) { toks.push({ t: "v" }); i++; continue; }
    if ("+-*/^()".includes(c)) { toks.push({ t: c }); i++; continue; }
    throw new Error("car");
  }
  const T = []; // multiplication implicite
  toks.forEach((k, idx) => {
    const p = T[T.length - 1];
    if (p && (p.t === "n" || p.t === "v" || p.t === ")") && (k.t === "v" || k.t === "(" || (k.t === "n" && p.t !== "n"))) T.push({ t: "*" });
    T.push(k);
  });
  let p = 0; const peek = () => T[p], eat = t => { if (T[p] && T[p].t === t) { p++; return true; } return false; };
  function expr() { const kids = [{ s: 1, n: term() }]; for (;;) { if (eat("+")) kids.push({ s: 1, n: term() }); else if (eat("-")) kids.push({ s: -1, n: term() }); else break; } return kids.length === 1 && kids[0].s === 1 ? kids[0].n : { k: "add", kids }; }
  function term() { const kids = [{ op: "*", n: unary() }]; for (;;) { if (eat("*")) kids.push({ op: "*", n: unary() }); else if (eat("/")) kids.push({ op: "/", n: unary() }); else break; } return kids.length === 1 ? kids[0].n : { k: "mul", kids }; }
  function unary() { if (eat("-")) return { k: "neg", a: unary() }; if (eat("+")) return unary(); return power(); }
  function power() { const b = atom(); if (eat("^")) return { k: "pow", b, e: unary() }; return b; }
  function atom() { const k = peek(); if (!k) throw new Error("fin"); if (k.t === "n") { p++; return { k: "num", v: k.v }; } if (k.t === "v") { p++; return { k: "var" }; } if (eat("(")) { const e = expr(); if (!eat(")")) throw new Error(")"); return { k: "par", a: e }; } throw new Error("tok"); }
  const tree = expr(); if (p !== T.length) throw new Error("reste");
  return tree;
}
function evalT(n, x) {
  switch (n.k) {
    case "num": return n.v; case "var": return x; case "par": return evalT(n.a, x); case "neg": return -evalT(n.a, x);
    case "pow": return Math.pow(evalT(n.b, x), evalT(n.e, x));
    case "add": return n.kids.reduce((s, c) => s + c.s * evalT(c.n, x), 0);

const topTerms = n => n.k === "add" ? n.kids.length : 1;
const hasPar = n => !n ? false : n.k === "par" ? true : n.k === "add" ? n.kids.some(c => hasPar(c.n)) : n.k === "mul" ? n.kids.some(c => hasPar(c.n)) : n.k === "neg" ? hasPar(n.a) : n.k === "pow" ? hasPar(n.b) : false;
function polyEval(coeffs, x) { return coeffs.reduce((s, [c, p]) => s + c * Math.pow(x, p), 0); }

function checkField(f, raw) {
  const s = String(raw ?? "").trim(); if (!s) return false;
  try {
    if (f.kind === "num") { const v = parseNumber(s); if (isNaN(v)) return false; const tol = f.tol ?? 1e-9; return Math.abs(v - f.answer) <= tol + 1e-9; }
    if (f.kind === "frac") {
      const t = norm(s); const v = parseNumber(s); if (isNaN(v) || Math.abs(v - f.answer) > 1e-9) return false;
      const m = t.match(/^(-?\d+)\/(-?\d+)$/); if (m) { const a = +m[1], b = +m[2]; return gcd(a, b) === 1 && Math.abs(b) !== 1; }
      return Number.isInteger(f.answer) || /^-?\d+\.\d+$/.test(t) && !f.fracOnly;
    }
    if (f.kind === "sci") { const r = parseSci(s); if (!r) return false; return Math.abs(r.mant) >= 1 && Math.abs(r.mant) < 10 && Math.abs(r.val - f.answer) <= Math.abs(f.answer) * 1e-9; }
    if (f.kind === "expr") {
      const tree = parseExpr(s, f.v || "x");
      for (const x of [1.37, -2.11, 0.53, 3.2]) { const a = evalT(tree, x), b = polyEval(f.coeffs, x); if (!isFinite(a) || Math.abs(a - b) > 1e-6 * Math.max(1, Math.abs(b))) return false; }
      if (f.maxTerms && (topTerms(tree) > f.maxTerms || hasPar(tree))) return false;
      if (f.factor) { if (tree.k !== "mul") return false; const nums = tree.kids.filter(c => c.n.k === "num").map(c => c.n.v); return nums.some(v => Math.abs(v) === f.factor) || tree.kids.some(c => c.n.k === "neg" && c.n.a.k === "num" && c.n.a.v === f.factor); }
      return true;
    }
    if (f.kind === "text") { const t = s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").trim(); return f.accept.some(a => t === a); }
  } catch (e) { return false; }
  return false;
}

function figBars(cats, vals) {
  const max = Math.ceil(Math.max(...vals) / 2) * 2 + 2, H = 150, Y = v => 180 - v / max * H, w = 250 / cats.length;

  const bars = vals.map((v, i) => `<rect x="${58 + i * w}" y="${Y(v)}" width="${w - 16}" height="${180 - Y(v)}" style="fill:var(--ink);opacity:.85"/><text class="m" x="${58 + i * w + (w - 16) / 2}" y="198" text-anchor="middle">${cats[i]}</text>`).join("");
  return svg(330, 215, g + bars + `<line class="s" x1="50" y1="180" x2="312" y2="180"/><text class="m" x="6" y="16">nombre d'élèves</text>`);
}

addG("sciences", "Vivant", () => { const c = pick(CHAINS); return { type: "order", pts: 1.5, prompt: `<p>Remets les êtres vivants dans l'ordre pour former une chaîne alimentaire (du <b>producteur</b> au dernier consommateur).</p>`, items: c, explain: `${c.join(" → ")}. La flèche signifie « est mangé par ». Le premier maillon est toujours un producteur (végétal chlorophyllien).` }; });
const ANIM = [["Chauve-souris", "Mammifère"], ["Dauphin", "Mammifère"], ["Manchot", "Oiseau"], ["Autruche", "Oiseau"], ["Requin", "Poisson"], ["Hippocampe", "Poisson"], ["Salamandre", "Amphibien"], ["Crapaud", "Amphibien"], ["Tortue", "Reptile"], ["Lézard", "Reptile"], ["Araignée", "Arachnide"], ["Coccinelle", "Insecte"], ["Escargot", "Mollusque"]];
addG("sciences", "Vivant", () => { const it = shuffle(ANIM).slice(0, 5); return { type: "match", pts: 2, prompt: `<p>Classe chaque animal dans son groupe.</p>`, items: it.map(([l, r]) => ({ left: l, answer: r })), choices: [...new Set(ANIM.map(x => x[1]))], explain: `Mammifères : poils, allaitent. Oiseaux : plumes. Poissons : écailles, nageoires, branchies. Amphibiens : peau nue et humide. Reptiles : écailles, peau sèche. Insectes : 6 pattes. Arachnides : 8 pattes. Mollusques : corps mou, souvent une coquille.` }; });
addG("sciences", "Organisme humain", () => { const c = ["Bouche", "Œsophage", "Estomac", "Intestin grêle", "Gros intestin"]; return { type: "order", pts: 1.5, prompt: `<p>Remets dans l'ordre les organes traversés par les aliments dans le tube digestif.</p>`, items: c, explain: c.join(" → ") + ". Les nutriments passent dans le sang au niveau de l'intestin grêle." }; });
addG("sciences", "Organisme humain", () => { const c = ["Nez / bouche", "Trachée", "Bronches", "Bronchioles", "Alvéoles pulmonaires"]; return { type: "order", pts: 1.5, prompt: `<p>Remets dans l'ordre le trajet de l'air lors de l'inspiration.</p>`, items: c, explain: c.join(" → ") + ". Les échanges de gaz avec le sang se font dans les alvéoles." }; });
const ENER = [["Panneau solaire photovoltaïque", "Lumineuse → électrique"], ["Lampe", "Électrique → lumineuse (+ thermique)"], ["Éolienne", "Mouvement → électrique"], ["Radiateur électrique", "Électrique → thermique"], ["Muscle", "Chimique → mouvement"], ["Pile", "Chimique → électrique"], ["Moteur électrique", "Électrique → mouvement"]];

addG("sciences", "Démarche scientifique", () => {
  const r = ri(64, 76), w = r + ri(18, 30), c1 = w + ri(28, 40), c2 = c1 + ri(25, 38);
  const doc = `<p>Sarah mesure sa fréquence cardiaque (en battements par minute) pour différents efforts.</p>` + table(["Effort", "Repos", "Marche", "Course lente", "Course rapide"], [["Fréquence cardiaque (bpm)", r, w, c1, c2]]);
  const v = ri(0, 2);
  if (v === 0) return { type: "qcm", pts: 1, prompt: doc + `<p>Dans cette expérience, quelle est la grandeur <b>mesurée</b> (variable dépendante) ?</p>`, options: ["La fréquence cardiaque", "L'intensité de l'effort", "L'âge de Sarah", "La durée de l'expérience"], answer: 0, explain: `On fait varier l'effort (variable indépendante) et on <b>mesure</b> la fréquence cardiaque (variable dépendante).` };
  if (v === 1) return { type: "num", pts: 1, prompt: doc + `<p>De combien de battements par minute la fréquence cardiaque augmente-t-elle entre le repos et la course rapide ?</p>`, fields: [num1("Augmentation :", c2 - r, (c2 - r) + " bpm", { suf: "bpm" })], explain: `${c2} ${MIN} ${r} = <b>${c2 - r} bpm</b>.` };
  return { type: "qcm", pts: 1, prompt: doc + `<p>Quelle conclusion peut-on tirer de ce tableau ?</p>`, options: ["Plus l'effort est intense, plus la fréquence cardiaque est élevée.", "La fréquence cardiaque ne dépend pas de l'effort.", "Plus l'effort est intense, plus la fréquence cardiaque diminue.", "Le cœur s'arrête au repos."], answer: 0, explain: `Les valeurs augmentent de gauche à droite : le cœur bat plus vite pour apporter plus de dioxygène et de nutriments aux muscles.` };
});

/* ============ banque : questions fixes (options mélangées) ============ */
const S = []; // {id, subject, theme, q}
const addS = (id, subject, theme, q) => S.push({ id, subject, theme, q });
// maths
addS("m-quad1", "maths", "Géométrie", { type: "qcm", pts: 1, prompt: `<p>Un quadrilatère a des diagonales de <b>même longueur</b>, <b>perpendiculaires</b> et qui se coupent en leur <b>milieu</b>. C'est un…</p>`, options: ["carré", "rectangle", "losange", "trapèze isocèle"], answer: 0, explain: "Même milieu → parallélogramme ; même longueur → rectangle ; perpendiculaires → losange. Rectangle ET losange = carré." });
addS("m-quad2", "maths", "Géométrie", { type: "qcm", pts: 1, prompt: `<p>Quelle propriété est vraie pour <b>tous</b> les parallélogrammes ?</p>`, options: ["Les diagonales se coupent en leur milieu.", "Les diagonales sont perpendiculaires.", "Les diagonales ont la même longueur.", "Il possède deux axes de symétrie."], answer: 0, explain: "Le parallélogramme a un centre de symétrie : le point d'intersection des diagonales, qui est leur milieu commun." });
addS("m-axes", "maths", "Géométrie", { type: "match", pts: 1.5, prompt: `<p>Combien d'axes de symétrie possède chaque figure ?</p>`, items: [{ left: "Rectangle (non carré)", answer: "2" }, { left: "Carré", answer: "4" }, { left: "Triangle équilatéral", answer: "3" }, { left: "Parallélogramme quelconque", answer: "0" }, { left: "Triangle isocèle (non équilatéral)", answer: "1" }], choices: ["0", "1", "2", "3", "4"], explain: "Rectangle : 2 (médiatrices des côtés). Carré : 4. Triangle équilatéral : 3. Parallélogramme : aucun axe, mais un centre de symétrie. Isocèle : 1." });
addS("m-prisme", "maths", "Géométrie", { type: "num", pts: 1.5, prompt: `<p>Un prisme droit a pour base un <b>hexagone</b>. Complète.</p>`, fields: [num1("Nombre de faces :", 8), num1("Nombre d'arêtes :", 18), num1("Nombre de sommets :", 12)], explain: "2 bases + 6 faces latérales = 8 faces. 6 arêtes par base × 2 + 6 arêtes latérales = 18. 6 sommets × 2 = 12." });
addS("m-alt", "maths", "Géométrie", { type: "qcm", pts: 1, prompt: `<p>Deux droites parallèles sont coupées par une sécante. Deux angles <b>alternes-internes</b> sont toujours…</p>`, options: ["de même amplitude", "supplémentaires (somme 180°)", "complémentaires (somme 90°)", "droits"], answer: 0, explain: "Avec des droites parallèles, les angles alternes-internes (et correspondants) ont la même amplitude." });
addS("m-quadsum", "maths", "Géométrie", { type: "num", pts: 1, prompt: `<p>Un quadrilatère a trois angles de 75°, 110° et 95°. Quelle est l'amplitude du quatrième angle ?</p>`, fields: [num1("Angle :", 80, "80°", { suf: "°" })], explain: "La somme des angles d'un quadrilatère vaut 360°. 360 − 75 − 110 − 95 = 80°." });
addS("m-mediatrice", "maths", "Géométrie", { type: "qcm", pts: 1, prompt: `<p>La <b>médiatrice</b> d'un segment est la droite…</p>`, options: ["perpendiculaire au segment et passant par son milieu", "qui passe par un sommet et le milieu du côté opposé", "qui partage un angle en deux angles égaux", "parallèle au segment"], answer: 0, explain: "Tout point de la médiatrice est à égale distance des deux extrémités du segment." });
addS("m-compare", "maths", "Nombres", { type: "qcm", pts: 1, prompt: `<p>Quel est le <b>plus grand</b> de ces nombres ?</p>`, options: [`${MIN}1/3`, `${MIN}0,35`, `${MIN}2/5`, `${MIN}0,5`], answer: 0, explain: "−1/3 ≈ −0,333 ; −0,35 ; −2/5 = −0,4 ; −0,5. Pour les négatifs, le plus grand est le plus proche de 0 : −1/3." });
addS("m-mult6", "maths", "Nombres", { type: "multi", pts: 1.5, prompt: `<p>Coche <b>tous</b> les multiples de 6.</p>`, options: ["42", "78", "96", "56", "100", "63"], answers: [0, 1, 2], explain: "Un multiple de 6 est pair ET multiple de 3 (somme des chiffres divisible par 3). 56 et 100 ne sont pas multiples de 3 ; 63 est impair." });
addS("m-inverse", "maths", "Nombres", { type: "match", pts: 1.5, prompt: `<p>Associe chaque nombre à son <b>opposé</b> ou à son <b>inverse</b> comme demandé.</p>`, items: [{ left: "L'opposé de −7", answer: "7" }, { left: "L'inverse de 2/3", answer: "3/2" }, { left: "L'inverse de −4", answer: "−1/4" }, { left: "L'opposé de 3/5", answer: "−3/5" }], choices: ["7", "−7", "3/2", "−2/3", "−1/4", "4", "−3/5", "5/3"], explain: "Opposé : on change le signe (somme = 0). Inverse : 1 divisé par le nombre (produit = 1)." });
addS("m-vocab", "maths", "Algèbre", { type: "match", pts: 1.5, prompt: `<p>Traduis chaque phrase par une expression.</p>`, items: [{ left: "Le double de x augmenté de 3", answer: "2x + 3" }, { left: "Le double de (x augmenté de 3)", answer: "2(x + 3)" }, { left: "Le carré de x diminué de 3", answer: "x² − 3" }, { left: "Le triple du carré de x", answer: "3x²" }], choices: ["2x + 3", "2(x + 3)", "x² − 3", "(x − 3)²", "3x²", "(3x)²"], explain: "L'ordre des mots indique l'ordre des opérations : « le double de x augmenté de 3 » = on double d'abord, puis on ajoute 3." });
addS("m-graph", "maths", "Traitement de données", { type: "qcm", pts: 1, prompt: `<p>Le graphique d'une situation de proportionnalité est…</p>`, options: ["une droite qui passe par l'origine", "une droite qui ne passe pas par l'origine", "une courbe", "une droite horizontale"], answer: 0, explain: "Si y = k·x, alors pour x = 0 on a y = 0 : la droite passe par l'origine." });
// sciences
addS("s-palier", "sciences", "Matière", { type: "qcm", pts: 1, prompt: `<p>Pendant le palier de fusion d'un corps pur, la substance est…</p>`, options: ["à la fois solide et liquide, à température constante", "entièrement liquide et sa température augmente", "entièrement solide et sa température baisse", "gazeuse"], answer: 0, explain: "Pendant le palier, l'énergie reçue sert à changer d'état, pas à chauffer : la température reste constante." });
addS("s-part", "sciences", "Matière", { type: "match", pts: 1.5, prompt: `<p>Associe chaque état à la description de ses particules.</p>`, items: [{ left: "Solide", answer: "Collées, ordonnées, vibrent sur place" }, { left: "Liquide", answer: "Proches, désordonnées, glissent les unes sur les autres" }, { left: "Gaz", answer: "Éloignées, désordonnées, très agitées" }], choices: ["Collées, ordonnées, vibrent sur place", "Proches, désordonnées, glissent les unes sur les autres", "Éloignées, désordonnées, très agitées"], explain: "C'est le modèle particulaire : plus on chauffe, plus les particules s'agitent et s'éloignent." });
addS("s-masse", "sciences", "Matière", { type: "qcm", pts: 1, prompt: `<p>On fait fondre complètement 50 g de glace dans un récipient fermé. Quelle est la masse d'eau liquide obtenue ?</p>`, options: ["50 g", "Plus de 50 g", "Moins de 50 g", "On ne peut pas savoir"], answer: 0, explain: "Lors d'un changement d'état, la masse se conserve : les particules sont les mêmes, seule leur disposition change. (Le volume, lui, change.)" });
addS("s-gaz", "sciences", "Matière", { type: "multi", pts: 1.5, prompt: `<p>Coche les propositions <b>vraies</b> au sujet des gaz.</p>`, options: ["Un gaz occupe tout l'espace disponible.", "Un gaz peut être comprimé.", "Un gaz a une masse.", "Un gaz a une forme propre."], answers: [0, 1, 2], explain: "Un gaz n'a ni forme ni volume propres, il est compressible et il a bien une masse (1 L d'air ≈ 1,2 g)." });
addS("s-pur", "sciences", "Matière", { type: "qcm", pts: 1, prompt: `<p>L'eau <b>distillée</b> est…</p>`, options: ["un corps pur", "un mélange homogène", "un mélange hétérogène", "une solution"], answer: 0, explain: "La distillation ne laisse que de l'eau : une seule substance, donc un corps pur. L'eau du robinet, elle, est un mélange (sels minéraux dissous)." });
addS("s-flotte", "sciences", "Matière", { type: "qcm", pts: 1, prompt: `<p>La masse volumique de l'eau vaut 1 g/cm³. Un objet de masse volumique 0,8 g/cm³ placé dans l'eau…</p>`, options: ["flotte", "coule", "reste entre deux eaux", "se dissout"], answer: 0, explain: "Un objet moins dense que l'eau (ρ < 1 g/cm³) flotte." });
addS("s-photo", "sciences", "Vivant", { type: "multi", pts: 1.5, prompt: `<p>De quoi une plante verte a-t-elle besoin pour réaliser la <b>photosynthèse</b> ? Coche tout ce qui convient.</p>`, options: ["De la lumière", "De l'eau", "Du dioxyde de carbone", "Du dioxygène", "Du sucre venant du sol"], answers: [0, 1, 2], explain: "Lumière + eau + CO₂ (+ sels minéraux) → matière organique (glucose) + dioxygène rejeté. Le dioxygène est produit, pas consommé par la photosynthèse." });
addS("s-prod", "sciences", "Vivant", { type: "qcm", pts: 1, prompt: `<p>Dans un écosystème, les <b>producteurs</b> sont…</p>`, options: ["les végétaux chlorophylliens", "les herbivores", "les décomposeurs", "les carnivores"], answer: 0, explain: "Ils fabriquent leur propre matière organique grâce à la lumière (photosynthèse)." });
addS("s-decomp", "sciences", "Vivant", { type: "qcm", pts: 1, prompt: `<p>Quel est le rôle des <b>décomposeurs</b> (champignons, bactéries, vers de terre…) ?</p>`, options: ["Transformer la matière organique morte en matière minérale", "Fabriquer de la matière organique grâce à la lumière", "Manger les herbivores", "Polliniser les fleurs"], answer: 0, explain: "Ils recyclent la matière : les sels minéraux libérés seront à nouveau utilisés par les plantes." });
addS("s-fleur", "sciences", "Vivant", { type: "match", pts: 1.5, prompt: `<p>Associe chaque partie de la fleur à son rôle.</p>`, items: [{ left: "Étamine", answer: "Produit le pollen (organe mâle)" }, { left: "Pistil", answer: "Contient les ovules (organe femelle)" }, { left: "Pétales", answer: "Attirent les insectes pollinisateurs" }, { left: "Sépales", answer: "Protègent le bouton floral" }], choices: ["Produit le pollen (organe mâle)", "Contient les ovules (organe femelle)", "Attirent les insectes pollinisateurs", "Protègent le bouton floral"], explain: "Après la pollinisation et la fécondation, l'ovule devient graine et le pistil devient fruit." });
addS("s-pollin", "sciences", "Vivant", { type: "qcm", pts: 1, prompt: `<p>La <b>pollinisation</b>, c'est…</p>`, options: ["le transport du pollen des étamines jusqu'au pistil", "la transformation de la fleur en fruit", "la germination de la graine", "la chute des feuilles"], answer: 0, explain: "Le pollen est transporté par le vent ou les animaux (insectes surtout). Elle précède la fécondation." });
addS("s-vert", "sciences", "Vivant", { type: "qcm", pts: 1, prompt: `<p>Quel critère permet de dire qu'un animal est un <b>vertébré</b> ?</p>`, options: ["Il possède une colonne vertébrale", "Il possède des pattes", "Il vit sur la terre ferme", "Il a le sang chaud"], answer: 0, explain: "Un vertébré a un squelette interne avec une colonne vertébrale (poissons, amphibiens, reptiles, oiseaux, mammifères)." });
addS("s-cell", "sciences", "Vivant", { type: "qcm", pts: 1, prompt: `<p>Quelle affirmation est correcte ?</p>`, options: ["Tous les êtres vivants sont constitués d'une ou plusieurs cellules.", "Seuls les animaux sont constitués de cellules.", "Les plantes n'ont pas de cellules.", "Une cellule est visible à l'œil nu dans tous les cas."], answer: 0, explain: "La cellule est l'unité de base du vivant ; on l'observe généralement au microscope." });
addS("s-champi", "sciences", "Vivant", { type: "qcm", pts: 1, prompt: `<p>Un champignon n'est pas un producteur car…</p>`, options: ["il ne possède pas de chlorophylle", "il pousse dans l'ombre", "il n'a pas de racines", "il est trop petit"], answer: 0, explain: "Sans chlorophylle, pas de photosynthèse : le champignon se nourrit de matière organique (souvent morte) → décomposeur." });
addS("s-alv", "sciences", "Organisme humain", { type: "qcm", pts: 1, prompt: `<p>Où se font les échanges de gaz entre l'air et le sang ?</p>`, options: ["Dans les alvéoles pulmonaires", "Dans la trachée", "Dans le cœur", "Dans l'estomac"], answer: 0, explain: "Les alvéoles ont une paroi très fine entourée de capillaires : le dioxygène passe dans le sang, le CO₂ passe dans l'air." });
addS("s-gr", "sciences", "Organisme humain", { type: "qcm", pts: 1, prompt: `<p>Quels éléments du sang transportent le <b>dioxygène</b> ?</p>`, options: ["Les globules rouges", "Les globules blancs", "Les plaquettes", "Le plasma seul"], answer: 0, explain: "Les globules rouges contiennent l'hémoglobine qui fixe le dioxygène. Les globules blancs défendent l'organisme, les plaquettes servent à la coagulation." });
addS("s-absorp", "sciences", "Organisme humain", { type: "qcm", pts: 1, prompt: `<p>Dans quel organe les nutriments passent-ils principalement dans le sang ?</p>`, options: ["L'intestin grêle", "L'estomac", "L'œsophage", "Le gros intestin"], answer: 0, explain: "C'est l'absorption intestinale : la paroi de l'intestin grêle est très longue et plissée (villosités)." });
addS("s-air", "sciences", "Organisme humain", { type: "match", pts: 1.5, prompt: `<p>Compare l'air <b>expiré</b> à l'air <b>inspiré</b>. L'air expiré contient…</p>`, items: [{ left: "Dioxygène", answer: "Moins" }, { left: "Dioxyde de carbone", answer: "Plus" }, { left: "Vapeur d'eau", answer: "Plus" }, { left: "Diazote", answer: "Autant" }], choices: ["Plus", "Moins", "Autant"], explain: "Le corps consomme du dioxygène et rejette du CO₂ et de la vapeur d'eau ; le diazote n'est pas utilisé." });
addS("s-veine", "sciences", "Organisme humain", { type: "qcm", pts: 1, prompt: `<p>Les <b>veines</b> sont les vaisseaux sanguins qui…</p>`, options: ["ramènent le sang vers le cœur", "partent du cœur vers les organes", "relient les alvéoles à l'estomac", "transportent uniquement de l'air"], answer: 0, explain: "Artères : le sang part du cœur. Veines : le sang revient au cœur. Capillaires : échanges avec les cellules." });
addS("s-coeur", "sciences", "Organisme humain", { type: "qcm", pts: 1, prompt: `<p>Le ventricule <b>gauche</b> du cœur envoie le sang…</p>`, options: ["vers tous les organes du corps (par l'aorte)", "vers les poumons", "vers l'oreillette droite", "vers le foie uniquement"], answer: 0, explain: "Cœur gauche : sang riche en dioxygène envoyé à tout le corps. Cœur droit : sang envoyé aux poumons." });
addS("s-renouv", "sciences", "Énergie", { type: "multi", pts: 1.5, prompt: `<p>Coche les sources d'énergie <b>renouvelables</b>.</p>`, options: ["Le soleil", "Le vent", "La biomasse (bois)", "Le pétrole", "Le gaz naturel", "L'uranium"], answers: [0, 1, 2], explain: "Renouvelable = qui se reconstitue rapidement à l'échelle humaine. Pétrole, gaz et uranium sont des stocks épuisables." });
addS("s-conduc", "sciences", "Énergie", { type: "qcm", pts: 1, prompt: `<p>On laisse une cuillère en métal dans une soupe chaude. Après un moment, le manche est chaud. Ce transfert de chaleur s'appelle…</p>`, options: ["la conduction", "la convection", "le rayonnement", "l'évaporation"], answer: 0, explain: "La chaleur se transmet de proche en proche dans la matière solide : c'est la conduction. Les métaux sont de bons conducteurs." });
addS("s-serie", "sciences", "Énergie", { type: "qcm", pts: 1, prompt: `<p>Deux lampes sont branchées <b>en série</b>. Une lampe grille. Que se passe-t-il ?</p>`, options: ["L'autre lampe s'éteint aussi", "L'autre lampe brille davantage", "L'autre lampe continue de briller normalement", "La pile explose"], answer: 0, explain: "En série, il n'y a qu'un seul chemin pour le courant : si le circuit est ouvert, plus rien ne fonctionne. En dérivation, l'autre lampe resterait allumée." });
addS("s-isol", "sciences", "Énergie", { type: "qcm", pts: 1, prompt: `<p>Lequel de ces matériaux est le meilleur <b>isolant thermique</b> ?</p>`, options: ["La laine de verre", "Le cuivre", "L'aluminium", "Le fer"], answer: 0, explain: "Les isolants emprisonnent de l'air, mauvais conducteur de chaleur. Les métaux sont de bons conducteurs." });

/* ============ composition d'un examen ============ */
const QUOTAS = {
  // répartition calquée sur la circulaire CE1D 2025-2026 : Nombres 40 %, Géométrie 30 %, Grandeurs 15 %, Traitement de données 15 %
  maths: { "Nombres": 3, "Algèbre": 4, "Géométrie": 5, "Grandeurs": 3, "Traitement de données": 3, "Justifier": 2 },
  sciences: { "Matière": 4, "Vivant": 3, "Organisme humain": 3, "Énergie": 2, "Air, eau et sol": 2, "L'homme et l'environnement": 2, "Démarche scientifique": 1, "Justifier": 2 },
};
const store = {
  get(k, d) { try { const v = localStorage.getItem("ce1d:" + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("ce1d:" + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem("ce1d:" + k); } catch (e) {} },
};
function prepare(q, subject, theme, id) {
  q = JSON.parse(JSON.stringify(q)); q.id = id; q.subject = subject; q.theme = q.realTheme || theme; q.section = theme;
  if (q.type === "qcm") { const order = shuffle(q.options.map((_, i) => i)); q.options = order.map(i => q.options[i]); q.answer = order.indexOf(q.answer); }
  if (q.type === "multi") { const order = shuffle(q.options.map((_, i) => i)); q.options = order.map(i => q.options[i]); q.answers = q.answers.map(a => order.indexOf(a)); }
  if (q.type === "match") { q.items = shuffle(q.items); q.choices = [...new Set(q.choices)]; if (q.choices.length > 3 && !q.choices.every(c => /^\d+$/.test(c))) q.choices = shuffle(q.choices); }
  if (q.type === "order") { let o; do o = shuffle(q.items.map((_, i) => i)); while (o.every((v, i) => v === i)); q.start = o; }
  return q;
}
function buildExam(subject, length) {
  const seen = new Set(store.get("seen", []));
  const subs = subject === "mixte" ? ["maths", "sciences"] : [subject];
  const factor = (subject === "mixte" ? 0.5 : 1) * (length === "court" ? 0.5 : 1);
  const qs = [];
  subs.forEach(sb => {
    Object.entries(QUOTAS[sb]).forEach(([theme, n]) => {
      const k = Math.max(1, Math.round(n * factor));
      const gens = shuffle(G.filter(g => g.subject === sb && g.theme === theme)).map(g => ({ kind: "g", g }));
      const stat = S.filter(s => s.subject === sb && s.theme === theme);
      const fresh = shuffle(stat.filter(s => !seen.has(s.id))), old = shuffle(stat.filter(s => seen.has(s.id)));
      // on alterne générateurs (nombres nouveaux) et questions fixes jamais vues
      const pool = []; const A = gens.slice(), B = fresh.map(s => ({ kind: "s", s })), C = old.map(s => ({ kind: "s", s }));
      while (A.length || B.length) { if (A.length) pool.push(A.shift()); if (B.length) pool.push(B.shift()); }
      pool.push(...C);
      pool.slice(0, k).forEach(p => {
        if (p.kind === "g") qs.push(prepare(p.g.make(), sb, theme, gid("g")));
        else { qs.push(prepare(p.s.q, sb, theme, p.s.id)); seen.add(p.s.id); }
      });
    });
  });
  const all = S.map(s => s.id); let arr = [...seen]; if (arr.length > all.length * 0.8) arr = arr.slice(-Math.floor(all.length * 0.4));
  store.set("seen", arr);
  // ouvertes à la fin de chaque partie, comme dans le vrai carnet
  const ordered = []; subs.forEach(sb => { const part = qs.filter(q => q.subject === sb); ordered.push(...shuffle(part.filter(q => q.type !== "open")), ...part.filter(q => q.type === "open")); });
  return { id: gid("ex"), subject, length, started: Date.now(), questions: ordered, answers: {}, idx: 0, finished: null, grading: {} };
}

/* ============ correction ============ */
const half = x => Math.round(x * 2) / 2;
function isAnswered(q, v) {
  if (v == null) return false;
  if (q.type === "qcm") return v !== undefined && v !== null;
  if (q.type === "multi") return v.length > 0;
  if (q.type === "num") return v.some(x => String(x || "").trim());
  if (q.type === "match") return v.some(x => x);
  if (q.type === "order") return !!v.touched;
  if (q.type === "open") return String(v).trim().length > 0;
  return false;
}
function gradeAuto(q, v) {
  const P = q.pts;
  if (q.type === "qcm") return { pts: v === q.answer ? P : 0 };
  if (q.type === "multi") { const sel = v || []; const good = sel.filter(i => q.answers.includes(i)).length, bad = sel.length - good; return { pts: half(Math.max(0, (good - bad) / q.answers.length) * P) }; }
  if (q.type === "num") { const oks = q.fields.map((f, i) => checkField(f, (v || [])[i])); return { pts: half(oks.filter(Boolean).length / oks.length * P), oks }; }
  if (q.type === "match") { const oks = q.items.map((it, i) => (v || [])[i] === it.answer); return { pts: half(oks.filter(Boolean).length / oks.length * P), oks }; }
  if (q.type === "order") { const ord = (v && v.order) || q.start; const oks = ord.map((x, i) => x === i); const all = oks.every(Boolean); return { pts: all ? P : half(oks.filter(Boolean).length / oks.length * P * 0.6), oks }; }
  return { pts: 0 };
}
function qPoints(ex, q) {
  if (q.type !== "open") return gradeAuto(q, ex.answers[q.id]).pts;
  const g = ex.grading[q.id]; return g && typeof g.pts === "number" ? g.pts : 0;
}
function totals(ex) {
  let got = 0, max = 0; const th = {};
  ex.questions.forEach(q => { const p = qPoints(ex, q); got += p; max += q.pts; const t = th[q.theme] || (th[q.theme] = { got: 0, max: 0, subject: q.subject }); t.got += p; t.max += q.pts; });
  return { got, max, th };
}

/* ============ capacité IA (correction des réponses rédigées) ============ */
let sampleFn; // undefined = pas encore su, null = indisponible
const sampleReady = new Promise(res => {
  (async () => { await 0; try { sampleFn = window.claude && window.claude.use ? await window.claude.use("sample") : null; } catch (e) { sampleFn = null; } res(); if (view === "results" && !grading) render(); })();
  setTimeout(() => { if (sampleFn === undefined) { sampleFn = null; res(); if (view === "results" && !grading) render(); } }, 11000);
});

let grading = false;
async function gradeOpen(ex) {
  const open = ex.questions.filter(q => q.type === "open" && !ex.grading[q.id]);
  const empty = open.filter(q => !isAnswered(q, ex.answers[q.id]));
  empty.forEach(q => ex.grading[q.id] = { pts: 0, feedback: "Pas de réponse.", by: "auto" });
  const todo = open.filter(q => isAnswered(q, ex.answers[q.id]));
  if (!todo.length) { save(); render(); return; }
  grading = true; render(); await sampleReady;
  if (!sampleFn) grading = false;
  if (!sampleFn) { todo.forEach(q => ex.grading[q.id] = { mode: "self" }); save(); render(); return; }
  const tmp = document.createElement("div");
  const list = todo.map(q => { tmp.innerHTML = q.prompt; return { id: q.id, max: q.pts, question: tmp.textContent.trim(), reponse_modele: q.model, criteres: q.criteria, reponse_eleve: String(ex.answers[q.id]).slice(0, 3000) }; });
  const prompt = `Tu es correcteur de l'épreuve externe CE1D (Belgique, Fédération Wallonie-Bruxelles, fin de 2e secondaire). Corrige les réponses rédigées d'une élève de 13-14 ans.
Règles :
- Pour chaque question, attribue des points de 0 au maximum ("max"), par pas de 0,5, en suivant les critères. Accepte toute formulation correcte, même différente du modèle. Ne pénalise pas l'orthographe.
- Sois juste et exigeant comme au vrai CE1D : une réponse sans justification ne reçoit pas les points de justification.
- "feedback" : 1 à 3 phrases en français, adressées à l'élève (tutoiement), qui disent ce qui est juste et précisément ce qui manque.
- Si la réponse est hors sujet ou vide de sens, 0 point.
Réponds uniquement avec un tableau JSON : [{"id":"...","points":nombre,"feedback":"..."}]

Questions :
${JSON.stringify(list, null, 1)}`;
  try {
    const out = await sampleFn.json(prompt, { cache: false });
    const arr = Array.isArray(out) ? out : [];
    todo.forEach(q => {
      const r = arr.find(x => x && x.id === q.id);
      if (r && typeof r.points === "number") ex.grading[q.id] = { pts: Math.max(0, Math.min(q.pts, half(r.points))), feedback: String(r.feedback || ""), by: "ai" };
      else ex.grading[q.id] = { mode: "self", err: true };
    });
  } catch (e) {
    const msg = { not_granted: "La correction automatique n'a pas été autorisée.", rate_limited: "Trop de demandes pour le moment.", sampling_disabled: "La correction automatique n'est pas disponible sur ce compte." }[e && e.code] || "La correction automatique n'a pas répondu.";
    todo.forEach(q => ex.grading[q.id] = { mode: "self", err: msg });
  }
  grading = false; save(); updateHistory(ex); render();
}

/* ============ état & sauvegarde ============ */
let view = "home", ex = store.get("current", null), choice = { subject: "maths", length: "complet" }, confirmOpen = false, filter = "all";
if (ex && ex.finished) view = "home";
function save() { if (ex) store.set("current", ex); }
function updateHistory(e) {
  const t = totals(e); const h = store.get("history", []); const rec = { id: e.id, subject: e.subject, length: e.length, date: e.finished, got: t.got, max: t.max, th: t.th, time: e.finished - e.started };
  const i = h.findIndex(x => x.id === e.id); if (i >= 0) h[i] = rec; else h.unshift(rec); store.set("history", h.slice(0, 30));
}
const subjName = s => ({ maths: "Mathématiques", sciences: "Sciences", mixte: "Maths + sciences" }[s]);
const mmss = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); };
const dateFr = t => new Date(t).toLocaleDateString("fr-BE", { day: "numeric", month: "short" }) + " · " + new Date(t).toLocaleTimeString("fr-BE", { hour: "2-digit", minute: "2-digit" });
const on20 = (g, m) => m ? fmt(g / m * 20, 1) : "0";

  up: `<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3 3 9h10z" fill="currentColor"/></svg>`,
  down: `<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13 3 7h10z" fill="currentColor"/></svg>`,
  sound: `<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6h3l4-3v10l-4-3H2z" fill="currentColor"/><path d="M11 5.5a3.5 3.5 0 0 1 0 5M12.5 3.5a6 6 0 0 1 0 9" stroke="currentColor" fill="none" stroke-width="1.4"/></svg>`,
};

function renderHome() {
  topinfo.innerHTML = "";
  const h = store.get("history", []);
  const agg = {}; h.slice(0, 8).forEach(r => Object.entries(r.th || {}).forEach(([k, v]) => { const a = agg[k] || (agg[k] = { got: 0, max: 0 }); a.got += v.got; a.max += v.max; }));
  const themes = Object.entries(agg).filter(([, v]) => v.max > 0).map(([k, v]) => [k, v.got / v.max]).sort((a, b) => a[1] - b[1]);
  const resume = ex && !ex.finished;
  app.innerHTML = `
  ${resume ? `<div class="resume"><span>Un examen de ${subjName(ex.subject).toLowerCase()} est en cours (${Object.keys(ex.answers).length} réponse(s) données).</span><button class="btn small" id="resume">Reprendre</button><button class="btn small" id="drop">Abandonner</button></div>` : ""}
  <section class="hero">
    <h1>Entraîne-toi au <mark>CE1D</mark> comme le jour J.</h1>
    <p>Un carnet d'examen différent à chaque fois : les nombres changent, les questions sont tirées au hasard et les réponses rédigées sont corrigées avec des commentaires.</p>
  </section>
  <p class="label">1. Choisis la matière</p>
  <div class="subjects" role="group" aria-label="Matière">
    ${["maths", "sciences", "mixte"].map(s => `<button class="subj" data-s="${s}" aria-pressed="${choice.subject === s}"><b>${subjName(s)}</b><span>${{ maths: "Nombres et algèbre, géométrie, grandeurs, traitement de données", sciences: "Matière, vivant, corps humain, énergie, air-eau-sol, environnement", mixte: "La moitié de chaque carnet" }[s]}</span></button>`).join("")}
  </div>
  <p class="label">2. Choisis la durée</p>
  <div class="startrow">
    <div class="seg" role="group" aria-label="Durée">
      <button data-l="complet" aria-pressed="${choice.length === "complet"}">Complet · ± 60 min</button>
      <button data-l="court" aria-pressed="${choice.length === "court"}">Court · ± 25 min</button>
    </div>
    <button class="btn primary" id="start">Commencer l'examen</button>
  </div>
  <div class="cols">
    <section class="panel"><h2>Tes derniers examens</h2>
      ${h.length ? `<ul class="hist">${h.slice(0, 6).map(r => `<li><span><b>${subjName(r.subject)}</b> ${r.length === "court" ? "(court)" : ""}</span><span class="s">${on20(r.got, r.max)}/20</span><small>${dateFr(r.date)} · ${fmt(r.got, 1)}/${fmt(r.max, 1)} pts · ${mmss(r.time)}</small></li>`).join("")}</ul>` : `<p class="empty">Aucun examen pour l'instant. Ton premier résultat apparaîtra ici, avec ton temps.</p>`}
    </section>
    <section class="panel"><h2>À retravailler</h2>
      ${themes.length ? `<div class="themes">${themes.slice(0, 6).map(([k, v]) => `<div class="row"><span>${k}</span><em>${Math.round(v * 100)} %</em><div class="bar ${v < .5 ? "low" : ""}"><i style="width:${Math.round(v * 100)}%"></i></div></div>`).join("")}</div>` : `<p class="empty">Après ton premier examen, tes thèmes les plus faibles s'afficheront ici, du plus faible au plus fort.</p>`}
    </section>
  </div>
  <p class="note">Pour t'entraîner aussi sur les vraies épreuves des années précédentes, elles sont publiées gratuitement sur <a href="https://www.enseignement.be" target="_blank" rel="noopener">enseignement.be</a>.</p>`;
  app.querySelectorAll(".subj").forEach(b => b.onclick = () => { choice.subject = b.dataset.s; renderHome(); });
  app.querySelectorAll("[data-l]").forEach(b => b.onclick = () => { choice.length = b.dataset.l; renderHome(); });
  $("#start").onclick = () => { ex = buildExam(choice.subject, choice.length); save(); view = "exam"; confirmOpen = false; render(); window.scrollTo(0, 0); };
  if (resume) { $("#resume").onclick = () => { view = "exam"; render(); }; $("#drop").onclick = () => { store.del("current"); ex = null; renderHome(); }; }
}

let timer = null;
function tick() { const t = $("#timer"); if (t && ex) t.textContent = mmss(Date.now() - ex.started); }
function renderExam() {
  const q = ex.questions[ex.idx], n = ex.questions.length, done = ex.questions.filter(x => isAnswered(x, ex.answers[x.id])).length;
  topinfo.innerHTML = `<span class="chip ink">${subjName(ex.subject)}</span><span class="chip">${done}/${n} répondues</span><span class="chip" id="timer">${mmss(Date.now() - ex.started)}</span>`;
  clearInterval(timer); timer = setInterval(tick, 1000);
  const canSpeak = "speechSynthesis" in window;
  app.innerHTML = `
  <article class="sheet">
    <div class="qhead">
      <span class="qnum">Question ${ex.idx + 1} <small>/ ${n}</small></span>
      <span class="chip">${esc(q.section === "Justifier" ? "Justifier" : q.theme)}</span>
      <span class="chip">${fmt(q.pts, 1)} pt${q.pts > 1 ? "s" : ""}</span>
      <span class="spacer"></span>
      ${canSpeak ? `<button class="listen" id="speak">${ICON.sound} Écouter</button>` : ""}
    </div>
    <div class="prompt" id="prompt">${q.prompt}</div>
    ${q.figure || ""}
    <div class="answer" id="answer"></div>
    <div class="nav">
      <button class="btn ghost" id="prev" ${ex.idx === 0 ? "disabled" : ""}>Précédente</button>
      ${ex.idx < n - 1 ? `<button class="btn primary" id="next">Suivante</button>` : `<button class="btn primary" id="finish">Remettre ma copie</button>`}
    </div>
    <div id="confirm"></div>
  </article>
  <nav class="dots" aria-label="Aller à la question">${ex.questions.map((x, i) => `<button class="dot ${isAnswered(x, ex.answers[x.id]) ? "done" : ""} ${i === ex.idx ? "cur" : ""}" data-i="${i}" aria-label="Question ${i + 1}">${i + 1}</button>`).join("")}</nav>
  <div class="nav"><span class="hint">Tes réponses sont gardées sur cet appareil si tu fermes la page.</span><button class="btn small" id="finish2">Remettre ma copie</button></div>`;
  renderAnswer(q);
  const go = i => { ex.idx = i; save(); confirmOpen = false; renderExam(); window.scrollTo({ top: 0 }); };
  $("#prev").onclick = () => go(ex.idx - 1);
  if ($("#next")) $("#next").onclick = () => go(ex.idx + 1);
  app.querySelectorAll(".dot").forEach(b => b.onclick = () => go(+b.dataset.i));
  const fin = () => { confirmOpen = true; showConfirm(); };
  if ($("#finish")) $("#finish").onclick = fin; $("#finish2").onclick = fin;
  if (confirmOpen) showConfirm();
  if (canSpeak) $("#speak").onclick = () => { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance($("#prompt").textContent); u.lang = "fr-BE"; u.rate = .95; speechSynthesis.speak(u); } catch (e) {} };
}
function showConfirm() {
  const miss = ex.questions.map((x, i) => isAnswered(x, ex.answers[x.id]) ? null : i + 1).filter(Boolean);
  $("#confirm").innerHTML = `<div class="confirm"><b>${miss.length ? `Il te reste ${miss.length} question(s) sans réponse : ${miss.join(", ")}.` : "Tu as répondu à toutes les questions."}</b><span>Une fois la copie remise, tu ne pourras plus modifier tes réponses.</span><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary" id="doFinish">Oui, corriger ma copie</button><button class="btn ghost" id="noFinish">Continuer l'examen</button></div></div>`;
  $("#confirm").scrollIntoView({ behavior: "smooth", block: "nearest" });
  $("#doFinish").onclick = () => { clearInterval(timer); try { speechSynthesis.cancel(); } catch (e) {} ex.finished = Date.now(); save(); updateHistory(ex); view = "results"; filter = "all"; render(); window.scrollTo(0, 0); gradeOpen(ex); };
  $("#noFinish").onclick = () => { confirmOpen = false; $("#confirm").innerHTML = ""; };
}
function setAns(q, v) { ex.answers[q.id] = v; save(); const d = app.querySelector(`.dot[data-i="${ex.idx}"]`); if (d) d.classList.toggle("done", isAnswered(q, v)); const c = topinfo.children[1]; if (c) c.textContent = ex.questions.filter(x => isAnswered(x, ex.answers[x.id])).length + "/" + ex.questions.length + " répondues"; }
function renderAnswer(q) {
  const box = $("#answer"), v = ex.answers[q.id];
  if (q.type === "qcm" || q.type === "multi") {
    const multi = q.type === "multi";
    box.innerHTML = (multi ? `<p class="hint">Plusieurs réponses possibles. Attention : une case cochée à tort enlève des points.</p>` : "") + q.options.map((o, i) => {
      const on = multi ? (v || []).includes(i) : v === i;
      return `<label class="opt ${on ? "on" : ""}"><input type="${multi ? "checkbox" : "radio"}" name="q-${q.id}" id="o-${q.id}-${i}" value="${i}" ${on ? "checked" : ""}><span>${o}</span></label>`;
    }).join("");
    box.querySelectorAll("input").forEach(inp => inp.onchange = () => {
      if (multi) setAns(q, [...box.querySelectorAll("input:checked")].map(x => +x.value)); else setAns(q, +inp.value);
      box.querySelectorAll(".opt").forEach(l => l.classList.toggle("on", l.querySelector("input").checked));
    });
  } else if (q.type === "num") {
    const vals = v || q.fields.map(() => "");
    const hasExpr = q.fields.some(f => f.kind === "expr" || f.kind === "frac");
    box.innerHTML = q.fields.map((f, i) => `<div class="field"><label for="f-${q.id}-${i}">${f.label}</label><input id="f-${q.id}-${i}" class="${f.wide ? "wide" : ""}" inputmode="${f.kind === "num" ? "decimal" : "text"}" autocomplete="off" spellcheck="false" value="${esc(vals[i])}">${f.suf ? `<span class="suf">${f.suf}</span>` : ""}</div>`).join("")
      + (hasExpr ? `<p class="hint">Tu peux écrire les fractions avec / (ex. 5/6) et les puissances avec ^ (ex. x^2).</p>` : `<p class="hint">Utilise la virgule pour les nombres décimaux.</p>`);
    box.querySelectorAll("input").forEach((inp, i) => inp.oninput = () => { const a = (ex.answers[q.id] || q.fields.map(() => "")).slice(); a[i] = inp.value; setAns(q, a); });
  } else if (q.type === "match") {
    const vals = v || q.items.map(() => "");
    box.innerHTML = `<div class="match">${q.items.map((it, i) => `<div class="mrow"><label for="m-${q.id}-${i}">${it.left}</label><select id="m-${q.id}-${i}"><option value="">— choisis —</option>${q.choices.map(c => `<option ${vals[i] === c ? "selected" : ""}>${esc(c)}</option>`).join("")}</select></div>`).join("")}</div>`;
    box.querySelectorAll("select").forEach((s, i) => s.onchange = () => { const a = (ex.answers[q.id] || q.items.map(() => "")).slice(); a[i] = s.value; setAns(q, a); });
  } else if (q.type === "order") {
    const ord = (v && v.order) || q.start.slice();
    box.innerHTML = `<p class="hint">Utilise les flèches pour déplacer les éléments.</p><ol class="order">${ord.map((k, i) => `<li><span class="n">${i + 1}</span><span class="t">${esc(q.items[k])}</span><button data-u="${i}" aria-label="Monter" ${i === 0 ? "disabled" : ""}>${ICON.up}</button><button data-d="${i}" aria-label="Descendre" ${i === ord.length - 1 ? "disabled" : ""}>${ICON.down}</button></li>`).join("")}</ol>`;
    const mv = (i, j) => { const o = ord.slice(); [o[i], o[j]] = [o[j], o[i]]; setAns(q, { order: o, touched: true }); renderAnswer(q); const b = box.querySelector(`[data-${j < i ? "u" : "d"}="${j}"]`) || box.querySelector(`li:nth-child(${j + 1}) button`); if (b) b.focus(); };
    box.querySelectorAll("[data-u]").forEach(b => b.onclick = () => mv(+b.dataset.u, +b.dataset.u - 1));
    box.querySelectorAll("[data-d]").forEach(b => b.onclick = () => mv(+b.dataset.d, +b.dataset.d + 1));
  } else if (q.type === "open") {
    box.innerHTML = `<label class="hint" for="t-${q.id}">Rédige ta réponse en phrases complètes. Montre tes calculs.</label><textarea id="t-${q.id}" placeholder="Ta réponse…">${esc(v || "")}</textarea>`;
    box.querySelector("textarea").oninput = e => setAns(q, e.target.value);
  }
}

function showMine(q, v) {
  if (!isAnswered(q, v)) return `<em>Pas de réponse</em>`;
  if (q.type === "qcm") return q.options[v];
  if (q.type === "multi") return `<ul>${v.map(i => `<li>${q.options[i]}</li>`).join("")}</ul>`;
  if (q.type === "num") { const r = gradeAuto(q, v); return `<ul>${q.fields.map((f, i) => `<li>${f.label} ${esc(v[i] || "—")} <span class="${r.oks[i] ? "ok" : "ko"}">${r.oks[i] ? "✓" : "✗"}</span></li>`).join("")}</ul>`; }
  if (q.type === "match") { const r = gradeAuto(q, v); return `<ul>${q.items.map((it, i) => `<li>${it.left} → ${esc(v[i] || "—")} <span class="${r.oks[i] ? "ok" : "ko"}">${r.oks[i] ? "✓" : "✗"}</span></li>`).join("")}</ul>`; }
  if (q.type === "order") return (v.order || q.start).map(k => esc(q.items[k])).join(" → ");
  if (q.type === "open") return esc(v).replace(/\n/g, "<br>");
}
function showRight(q) {
  if (q.type === "qcm") return q.options[q.answer];
  if (q.type === "multi") return `<ul>${q.answers.map(i => `<li>${q.options[i]}</li>`).join("")}</ul>`;
  if (q.type === "num") return `<ul>${q.fields.map(f => `<li>${f.label} <b>${f.show}</b></li>`).join("")}</ul>`;
  if (q.type === "match") return `<ul>${q.items.map(it => `<li>${it.left} → <b>${esc(it.answer)}</b></li>`).join("")}</ul>`;
  if (q.type === "order") return q.items.map(esc).join(" → ");
  if (q.type === "open") return esc(q.model);
}
function renderResults() {
  clearInterval(timer);
  const t = totals(ex), pct = t.max ? t.got / t.max : 0;
  const pendingSelf = ex.questions.some(q => q.type === "open" && ex.grading[q.id] && ex.grading[q.id].mode === "self" && typeof ex.grading[q.id].pts !== "number");
  const waitingAi = ex.questions.some(q => q.type === "open" && !ex.grading[q.id]);
  topinfo.innerHTML = `<span class="chip ink">${subjName(ex.subject)}</span><span class="chip">Temps : ${mmss(ex.finished - ex.started)}</span>`;
  const verdict = pct >= .8 ? ["Très solide.", "Tu es prête pour ce carnet. Continue à t'entraîner pour garder le rythme."] : pct >= .5 ? ["Réussi, mais on peut viser plus haut.", "Le CE1D se réussit à 50 %. Regarde tes erreurs ci-dessous : ce sont tes points faciles à gagner."] : ["Pas encore réussi.", "Le seuil est à 50 %. Commence par les thèmes en rouge et refais un examen court demain."];
  const themes = Object.entries(t.th).sort((a, b) => a[1].got / a[1].max - b[1].got / b[1].max);
  const list = ex.questions.map((q, i) => ({ q, i, p: qPoints(ex, q) })).filter(({ q, p }) => filter === "all" || (filter === "wrong" ? p < q.pts : true));
  app.innerHTML = `
  <section class="score">
    <div class="bigscore" aria-label="Note">${on20(t.got, t.max)}<small>/ 20</small></div>
    <div class="verdict"><h2>${verdict[0]}</h2><p>${verdict[1]}</p><p style="margin-top:6px"><b>${fmt(t.got, 1)} / ${fmt(t.max, 1)} points</b> · ${Math.round(pct * 100)} %</p></div>
  </section>
  ${grading || waitingAi ? `<div class="status"><span class="spin"></span>Correction de tes réponses rédigées en cours… La note se mettra à jour.</div>` : ""}
  ${pendingSelf ? `<div class="status">Pour tes réponses rédigées, compare avec la réponse modèle et donne-toi une note honnête : c'est comme ça que le correcteur regardera s'il manque une étape.</div>` : ""}
  <section class="panel"><h2>Par thème</h2><div class="themes">${themes.map(([k, v]) => `<div class="row"><span>${k}</span><em>${fmt(v.got, 1)}/${fmt(v.max, 1)}</em><div class="bar ${v.got / v.max < .5 ? "low" : ""}"><i style="width:${Math.round(v.got / v.max * 100)}%"></i></div></div>`).join("")}</div></section>
  <div class="filters"><div class="seg"><button data-f="all" aria-pressed="${filter === "all"}">Toutes les questions</button><button data-f="wrong" aria-pressed="${filter === "wrong"}">Seulement mes erreurs</button></div><span class="spacer" style="flex:1"></span><button class="btn primary" id="again">Nouvel examen</button></div>
  <div class="review">${list.map(({ q, i, p }) => {
    const g = ex.grading[q.id] || {}, cls = p >= q.pts ? "good" : p === 0 ? "bad" : "part";
    const self = q.type === "open" && g.mode === "self";
    return `<article class="rq ${cls}">
      <div class="top2"><b>Question ${i + 1}</b><span class="chip">${esc(q.theme)}</span><span class="pts">${self && typeof g.pts !== "number" ? "?" : fmt(p, 1)} / ${fmt(q.pts, 1)}</span></div>
      <div class="prompt">${q.prompt}</div>${q.figure || ""}
      <div class="ans"><div class="mine"><h4>Ta réponse</h4>${showMine(q, ex.answers[q.id])}</div><div class="right"><h4>${q.type === "open" ? "Réponse modèle" : "Bonne réponse"}</h4>${showRight(q)}</div></div>
      ${q.type === "open" && g.by === "ai" ? `<p class="redpen">${esc(g.feedback)}</p>` : ""}
      ${self ? `<div class="self"><span>${g.err && typeof g.err === "string" ? esc(g.err) + " " : ""}Ta note :</span>${[0, q.pts / 2, q.pts].map(v => `<button class="btn small" data-self="${q.id}" data-v="${v}" aria-pressed="${g.pts === v}">${fmt(v, 1)} pt</button>`).join("")}</div>` : ""}
      ${q.explain ? `<div class="explain">${q.explain}</div>` : ""}
      ${sampleFn && p < q.pts ? `<div><button class="btn small ghost" data-exp="${q.id}">Explique-moi autrement</button><p class="ai" id="ai-${q.id}" hidden></p></div>` : ""}
    </article>`;
  }).join("") || `<p class="empty">Aucune erreur : bravo !</p>`}</div>`;
  app.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { filter = b.dataset.f; renderResults(); });
  $("#again").onclick = () => { store.del("current"); ex = null; view = "home"; render(); window.scrollTo(0, 0); };
  app.querySelectorAll("[data-self]").forEach(b => b.onclick = () => { ex.grading[b.dataset.self] = { mode: "self", pts: +b.dataset.v }; save(); updateHistory(ex); renderResults(); });
  app.querySelectorAll("[data-exp]").forEach(b => b.onclick = () => explain(b, ex.questions.find(q => q.id === b.dataset.exp)));
}
async function explain(btn, q) {
  const out = $("#ai-" + q.id); out.hidden = false; out.textContent = "Réflexion…"; btn.disabled = true;
  const d = document.createElement("div"); d.innerHTML = q.prompt; const r = document.createElement("div"); r.innerHTML = showRight(q); const m = document.createElement("div"); m.innerHTML = showMine(q, ex.answers[q.id]);
  const prompt = `Tu es un professeur patient qui prépare une élève belge de 2e secondaire au CE1D. Explique-lui en français, en 6 lignes maximum, avec des mots simples et en la tutoyant, pourquoi la bonne réponse est correcte et où se trouve son erreur. Donne une astuce pour ne plus se tromper. Pas de titre, pas de LaTeX : écris les calculs en texte simple.

Question : ${d.textContent.trim()}
Bonne réponse : ${r.textContent.trim()}
Réponse de l'élève : ${m.textContent.trim()}`;
  try { await sampleFn(prompt, { modelTier: "quick", onText: ({ text }) => { out.textContent = text; } }); }
  catch (e) { out.textContent = e && e.code === "not_granted" ? "L'explication n'a pas été autorisée." : e && e.code === "rate_limited" ? "Trop de demandes. Réessaie dans un moment." : (e && e.text) || "L'explication n'a pas pu être générée. Réessaie."; }
  btn.disabled = false;
}
if (ex && ex.finished && Object.keys(ex.grading).length === 0 && ex.questions.some(q => q.type === "open")) { /* examen remis mais non corrigé */ view = "results"; }
render();
if (view === "results") gradeOpen(ex);
})();
</script>
