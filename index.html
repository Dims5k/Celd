<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Examen blanc CE1D (maths, sciences, français, néerlandais) pour la 2e secondaire en Fédération Wallonie-Bruxelles. Nouvelles questions à chaque examen.">
<style>html{color-scheme:light}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Examen blanc CE1D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout : une feuille de cahier quadrillé ; une question par feuille ; la correction arrive au stylo rouge. */
:root{
  --paper:#F7F9FB; --grid:#DCE6F0; --card:#FFFFFF; --fg:#1F242D; --muted:#5B6574; --line:#C9D3DE;
  --ink:#1D43A8; --ink-soft:#E3EAFB; --red:#C4302A; --red-soft:#FBE7E5; --ok:#1E7A45; --ok-soft:#E1F3E8; --hl:#F4DC5B;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-hand:"Caveat", "Comic Sans MS", cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#12161D; --grid:#1C2330; --card:#181E27; --fg:#E6EAF0; --muted:#98A3B3; --line:#2E3847;
  --ink:#8FB0FF; --ink-soft:#1E2A45; --red:#FF7B70; --red-soft:#3A1F1E; --ok:#6FD39A; --ok-soft:#173226; --hl:#E8C93A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12161D; --grid:#1C2330; --card:#181E27; --fg:#E6EAF0; --muted:#98A3B3; --line:#2E3847;
  --ink:#8FB0FF; --ink-soft:#1E2A45; --red:#FF7B70; --red-soft:#3A1F1E; --ok:#6FD39A; --ok-soft:#173226; --hl:#E8C93A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--fg);font-family:var(--f-body);font-size:17px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;padding-inline:16px;padding-block:0 48px;min-height:100vh}
.wrap{max-width:860px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* barre du haut */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:2px solid var(--fg);
  display:flex;align-items:center;gap:12px;padding-block:12px;margin-bottom:24px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--muted);letter-spacing:.02em}
.top .spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:3px 10px;border:1.5px solid var(--line);border-radius:999px;background:var(--card);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.ink{border-color:var(--ink);color:var(--ink)}

/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--fg);background:var(--card);padding:10px 18px;border-radius:10px;font-weight:700;min-height:46px}
.btn:hover{background:var(--ink-soft)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--card)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:var(--line)}
.btn.small{padding:6px 12px;min-height:36px;font-size:15px;border-width:1.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* accueil */
.hero{display:grid;gap:10px;margin-bottom:28px}
.hero h1{font-size:clamp(34px,6vw,54px);font-weight:800;letter-spacing:-.02em}
.hero h1 mark{background:linear-gradient(transparent 55%,var(--hl) 55%);color:inherit;padding:0 4px}
.hero p{margin:0;color:var(--muted);max-width:60ch}
.label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 10px}
.subjects{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:22px}
.subj.all{grid-column:1 / -1;border-style:dashed}
.textdoc{background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:14px 18px;margin:8px 0 14px;font-size:16.5px;line-height:1.65;max-width:70ch}
.textdoc h3{font-size:18px;margin:0 0 8px}
.textdoc p{margin:0 0 10px}
fieldset.sub{border:0;margin:0 0 14px;padding:0;display:grid;gap:8px;min-width:0}
fieldset.sub legend{font-weight:700;margin-bottom:8px;padding:0}
.sn{color:var(--ink);font-family:var(--f-display)}
.audio{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:6px 0 10px;padding:14px;border:2px dashed var(--ink);border-radius:12px;background:var(--ink-soft)}
.audio > div{flex-basis:100%}
.conjv{font-style:italic}
details.tr{font-size:15px}details.tr summary{cursor:pointer;color:var(--ink);font-weight:700}
ol.subq{margin:0;padding-left:20px;font-size:15px;color:var(--muted)}
.subj{text-align:left;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:16px;display:grid;gap:6px;min-width:0}
.subj b{font-family:var(--f-display);font-size:21px}
.subj span{font-size:14px;color:var(--muted)}
.subj[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--ink-soft)}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);flex-wrap:wrap}
.seg button{border:0;background:none;padding:9px 16px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.startrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:34px}
.cols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.panel h2{font-size:19px;margin-bottom:12px}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.hist li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.hist li:last-child{border-bottom:0}
.hist .s{font-family:var(--f-hand);font-size:26px;color:var(--red);line-height:1;grid-row:span 2;align-self:center}
.hist small{color:var(--muted)}
.empty{color:var(--muted);font-size:15px;margin:0}
.bar{height:10px;border-radius:5px;background:var(--grid);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink)}
.bar.low i{background:var(--red)}
.themes{display:grid;gap:10px}
.themes .row{display:grid;grid-template-columns:minmax(0,1fr) 54px;gap:4px 10px;align-items:center;font-size:15px}
.themes .row .bar{grid-column:1 / -1}
.themes .row em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.note{font-size:14px;color:var(--muted);margin-top:18px}
.note a{color:var(--ink)}
.resume{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--hl);color:#1F242D;border-radius:12px;padding:12px 16px;margin-bottom:22px;font-weight:700}
.resume .btn{border-color:#1F242D;background:#fff;color:#1F242D}

/* examen */
.sheet{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:22px;position:relative;min-width:0}
.qhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.qnum{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.01em}
.qnum small{font-size:15px;color:var(--muted);font-weight:600}
.qhead .spacer{flex:1}
.prompt{font-size:18px;max-width:68ch}
.prompt p{margin:0 0 10px}
.prompt .expr{font-size:21px;font-variant-numeric:tabular-nums;background:var(--ink-soft);border-radius:8px;padding:8px 14px;display:inline-block;margin:4px 0 8px;letter-spacing:.01em}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.05;margin:0 2px;font-size:.92em}
.frac > span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
.frac > span:last-child{padding:0 3px}
table.doc{border-collapse:collapse;margin:6px 0 12px;font-size:16px;font-variant-numeric:tabular-nums}
table.doc th,table.doc td{border:1.5px solid var(--line);padding:6px 12px;text-align:center}
table.doc th{background:var(--ink-soft);font-weight:700}
.tablewrap{overflow-x:auto;max-width:100%}
.fig{margin:6px 0 14px;max-width:100%}
.fig svg{max-width:100%;height:auto;display:block}
.fig .s{stroke:var(--fg);stroke-width:2;fill:none}
.fig .f{fill:var(--ink-soft);stroke:var(--fg);stroke-width:2}
.fig .d{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4;fill:none}
.fig .g{stroke:var(--grid);stroke-width:1}
.fig .c{stroke:var(--ink);stroke-width:3;fill:none}
.fig text{fill:var(--fg);font-family:var(--f-body);font-size:15px}
.fig text.m{fill:var(--muted);font-size:12px}
.fig text.u{fill:var(--red);font-weight:700}
.answer{margin-top:18px;display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;background:var(--card);cursor:pointer}
.opt:hover{border-color:var(--ink)}
.opt input{margin-top:5px;accent-color:var(--ink);width:18px;height:18px;flex:none}
.opt.on{border-color:var(--ink);background:var(--ink-soft)}
.field{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.field label{min-width:0;font-weight:700}
.field input{border:none;border-bottom:2px solid var(--ink);background:transparent;padding:6px 4px;font-size:20px;color:var(--ink);width:min(260px,100%);font-variant-numeric:tabular-nums}
.field input.wide{width:min(420px,100%)}
.field .suf{color:var(--muted)}
.hint{font-size:14px;color:var(--muted);margin:0}
.match{display:grid;gap:8px}
.match .mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center;border-bottom:1px dashed var(--line);padding-bottom:8px}
select{border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card);width:100%}
.order{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.order li{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card)}
.order li .n{font-family:var(--f-display);font-weight:800;color:var(--ink);width:22px;text-align:center}
.order li .t{flex:1;min-width:0}
.order li button{border:1.5px solid var(--line);background:var(--card);border-radius:8px;width:38px;height:36px;display:grid;place-items:center}
textarea{width:100%;min-height:170px;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--card);line-height:1.6;resize:vertical;
  background-image:linear-gradient(transparent calc(1.6em - 1px),var(--grid) 1px);background-size:100% 1.6em;background-attachment:local}
.nav{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:22px;flex-wrap:wrap}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.dot{width:36px;height:36px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.dot.done{background:var(--ink-soft);border-color:var(--ink);color:var(--ink)}
.dot.cur{outline:3px solid var(--fg);outline-offset:1px}
.listen{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.confirm{margin-top:18px;border:2px solid var(--red);border-radius:12px;padding:16px;background:var(--red-soft);display:grid;gap:12px}

/* résultats */
.score{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px 26px;align-items:center;margin-bottom:24px}
.bigscore{font-family:var(--f-hand);color:var(--red);font-size:clamp(64px,12vw,96px);line-height:.9;transform:rotate(-4deg);padding:6px 10px;border:3px solid var(--red);border-radius:50% 46% 52% 44%;text-align:center;min-width:150px}
.bigscore small{display:block;font-size:.34em}
.verdict h2{font-size:26px;margin-bottom:6px}
.verdict p{margin:0;color:var(--muted)}
.status{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:10px;background:var(--ink-soft);margin-bottom:18px;font-size:15px}
.spin{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--ink);border-right-color:transparent;animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.review{display:grid;gap:14px;margin-top:22px}
.rq{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:10px;min-width:0}
.rq.bad{border-left:5px solid var(--red)}
.rq.good{border-left:5px solid var(--ok)}
.rq.part{border-left:5px solid var(--hl)}
.rq .top2{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.rq .pts{font-family:var(--f-hand);font-size:28px;color:var(--red);line-height:1;margin-left:auto}
.rq .prompt{font-size:16px}
.rq .prompt .expr{font-size:17px}
.ans{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.ans > div{border-radius:10px;padding:10px 12px;min-width:0;overflow-wrap:anywhere}
.ans .mine{background:var(--paper);border:1px solid var(--line)}
.ans .right{background:var(--ok-soft)}
.ans h4{margin:0 0 4px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ans ul{margin:0;padding-left:18px}
.redpen{font-family:var(--f-hand);color:var(--red);font-size:23px;line-height:1.25;margin:0}
.explain{font-size:15px;color:var(--fg);background:var(--paper);border-radius:10px;padding:10px 12px}
.explain b{color:var(--ink)}
.ai{font-size:15px;white-space:pre-wrap;border-left:3px solid var(--ink);padding:6px 12px;margin:0}
.self{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:15px}
.self button[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.ok{color:var(--ok);font-weight:700}.ko{color:var(--red);font-weight:700}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:26px}
@media (max-width:720px){
  .subjects{grid-template-columns:1fr}
  .subj.all{grid-column:auto}
  .cols{grid-template-columns:1fr}
  .sheet{padding:16px}
  .ans{grid-template-columns:1fr}
  .score{grid-template-columns:1fr;justify-items:start}
  .match .mrow{grid-template-columns:1fr}
  body{font-size:16px}
}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Examen blanc CE1D <small>2e secondaire</small></div>
    <div class="spacer"></div>
    <div id="topinfo" style="display:flex;gap:8px;flex-wrap:wrap"></div>
  </header>
  <main id="app"></main>
</div>

<script>
(() => {
"use strict";
/* ============ utilitaires ============ */
const $ = (s, r = document) => r.querySelector(s);
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const nz = (a, b) => { let n; do n = ri(a, b); while (n === 0); return n; };
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const MIN = "−";
function fmt(n, dec = 2) {
  const p = Math.pow(10, dec); let v = Math.round(n * p) / p; if (Object.is(v, -0)) v = 0;
  let s = String(Math.abs(v)).replace(".", ",");
  const [i, d] = s.split(","); const ii = i.length > 4 ? i.replace(/\B(?=(\d{3})+(?!\d))/g, " ") : i;
  s = d ? ii + "," + d : ii;
  return (v < 0 ? MIN : "") + s;
}
const rel = n => n < 0 ? "(" + fmt(n) + ")" : fmt(n);
const frac = (a, b) => `<span class="frac"><span>${a}</span><span>${b}</span></span>`;
const fracTxt = (n, d) => { if (d < 0) { n = -n; d = -d; } const g = gcd(n, d); n /= g; d /= g; return d === 1 ? fmt(n) : (n < 0 ? MIN : "") + Math.abs(n) + "/" + d; };
const sup = { 2: "²", 3: "³" };
function polyStr(terms, v = "x") { // terms: [[coef, pow], ...]
  const t = terms.filter(([c]) => c !== 0).sort((a, b) => b[1] - a[1]);
  if (!t.length) return "0";
  return t.map(([c, p], i) => {
    const neg = c < 0, a = Math.abs(c);
    const body = p === 0 ? fmt(a) : (a === 1 ? "" : fmt(a)) + v + (p > 1 ? (sup[p] || "^" + p) : "");
    return i === 0 ? (neg ? MIN : "") + body : (neg ? " " + MIN + " " : " + ") + body;
  }).join("");
}
const signed = n => n < 0 ? " " + MIN + " " + fmt(-n) : " + " + fmt(n);
let uid = 0; const gid = p => p + "-" + Date.now().toString(36) + "-" + (uid++);

/* ============ lecture des réponses ============ */
function norm(s) {
  return String(s || "").trim().replace(/[−–—]/g, "-").replace(/,/g, ".").replace(/\s+/g, "")
    .replace(/[×·]/g, "*").replace(/[÷:]/g, "/").replace(/²/g, "^2").replace(/³/g, "^3");
}
function parseNumber(s) {
  let t = norm(s).replace(/^[a-z]=/i, "").replace(/[a-zé°%€³²]+$/i, "").replace(/(cm|dm|km|mm|m|l|ml|g|kg|min|s|h)(\^\d)?$/i, "");
  if (!t) return NaN;
  let m = t.match(/^(-?\d*\.?\d+)\/(-?\d*\.?\d+)$/);
  if (m) return Number(m[1]) / Number(m[2]);
  if (/^[-+]?\d*\.?\d+$/.test(t)) return Number(t);
  return NaN;
}
function parseSci(s) {
  const t = norm(s).replace(/⁻/g, "-").replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]/g, c => "⁰¹²³⁴⁵⁶⁷⁸⁹".indexOf(c));
  const m = t.match(/^(-?\d+(?:\.\d+)?)(?:\*|x|\.)10\^?\(?(-?\d+)\)?$/i);
  if (!m) return null;
  return { mant: Number(m[1]), exp: Number(m[2]), val: Number(m[1]) * Math.pow(10, Number(m[2])) };
}
// mini-analyseur d'expressions littérales (une variable)
function parseExpr(src, v) {
  const s = norm(src).replace(/\^\(?(-?\d+)\)?/g, "^$1").toLowerCase();
  const toks = []; let i = 0;
  while (i < s.length) {
    const c = s[i];
    if (/[\d.]/.test(c)) { let j = i; while (j < s.length && /[\d.]/.test(s[j])) j++; toks.push({ t: "n", v: Number(s.slice(i, j)) }); i = j; continue; }
    if (c === v) { toks.push({ t: "v" }); i++; continue; }
    if ("+-*/^()".includes(c)) { toks.push({ t: c }); i++; continue; }
    throw new Error("car");
  }
  const T = []; // multiplication implicite
  toks.forEach((k, idx) => {
    const p = T[T.length - 1];
    if (p && (p.t === "n" || p.t === "v" || p.t === ")") && (k.t === "v" || k.t === "(" || (k.t === "n" && p.t !== "n"))) T.push({ t: "*" });
    T.push(k);
  });
  let p = 0; const peek = () => T[p], eat = t => { if (T[p] && T[p].t === t) { p++; return true; } return false; };
  function expr() { const kids = [{ s: 1, n: term() }]; for (;;) { if (eat("+")) kids.push({ s: 1, n: term() }); else if (eat("-")) kids.push({ s: -1, n: term() }); else break; } return kids.length === 1 && kids[0].s === 1 ? kids[0].n : { k: "add", kids }; }

addG("sciences", "Démarche scientifique", () => {
  const r = ri(64, 76), w = r + ri(18, 30), c1 = w + ri(28, 40), c2 = c1 + ri(25, 38);
  const doc = `<p>Sarah mesure sa fréquence cardiaque (en battements par minute) pour différents efforts.</p>` + table(["Effort", "Repos", "Marche", "Course lente", "Course rapide"], [["Fréquence cardiaque (bpm)", r, w, c1, c2]]);
  const v = ri(0, 2);
  if (v === 0) return { type: "qcm", pts: 1, prompt: doc + `<p>Dans cette expérience, quelle est la grandeur <b>mesurée</b> (variable dépendante) ?</p>`, options: ["La fréquence cardiaque", "L'intensité de l'effort", "L'âge de Sarah", "La durée de l'expérience"], answer: 0, explain: `On fait varier l'effort (variable indépendante) et on <b>mesure</b> la fréquence cardiaque (variable dépendante).` };
  if (v === 1) return { type: "num", pts: 1, prompt: doc + `<p>De combien de battements par minute la fréquence cardiaque augmente-t-elle entre le repos et la course rapide ?</p>`, fields: [num1("Augmentation :", c2 - r, (c2 - r) + " bpm", { suf: "bpm" })], explain: `${c2} ${MIN} ${r} = <b>${c2 - r} bpm</b>.` };
  return { type: "qcm", pts: 1, prompt: doc + `<p>Quelle conclusion peut-on tirer de ce tableau ?</p>`, options: ["Plus l'effort est intense, plus la fréquence cardiaque est élevée.", "La fréquence cardiaque ne dépend pas de l'effort.", "Plus l'effort est intense, plus la fréquence cardiaque diminue.", "Le cœur s'arrête au repos."], answer: 0, explain: `Les valeurs augmentent de gauche à droite : le cœur bat plus vite pour apporter plus de dioxygène et de nutriments aux muscles.` };
});

const S = []; // {id, subject, theme, q}
const addS = (id, subject, theme, q) => S.push({ id, subject, theme, q });
// maths
addS("m-quad1", "maths", "Géométrie", { type: "qcm", pts: 1, prompt: `<p>Un quadrilatère a des diagonales de <b>même longueur</b>, <b>perpendiculaires</b> et qui se coupent en leur <b>milieu</b>. C'est un…</p>`, options: ["carré", "rectangle", "losange", "trapèze isocèle"], answer: 0, explain: "Même milieu → parallélogramme ; même longueur → rectangle ; perpendiculaires → losange. Rectangle ET losange = carré." });
addS("m-quad2", "maths", "Géométrie", { type: "qcm", pts: 1, prompt: `<p>Quelle propriété est vraie pour <b>tous</b> les parallélogrammes ?</p>`, options: ["Les diagonales se coupent en leur milieu.", "Les diagonales sont perpendiculaires.", "Les diagonales ont la même longueur.", "Il possède deux axes de symétrie."], answer: 0, explain: "Le parallélogramme a un centre de symétrie : le point d'intersection des diagonales, qui est leur milieu commun." });
addS("m-axes", "maths", "Géométrie", { type: "match", pts: 1.5, prompt: `<p>Combien d'axes de symétrie possède chaque figure ?</p>`, items: [{ left: "Rectangle (non carré)", answer: "2" }, { left: "Carré", answer: "4" }, { left: "Triangle équilatéral", answer: "3" }, { left: "Parallélogramme quelconque", answer: "0" }, { left: "Triangle isocèle (non équilatéral)", answer: "1" }], choices: ["0", "1", "2", "3", "4"], explain: "Rectangle : 2 (médiatrices des côtés). Carré : 4. Triangle équilatéral : 3. Parallélogramme : aucun axe, mais un centre de symétrie. Isocèle : 1." });
addS("m-prisme", "maths", "Géométrie", { type: "num", pts: 1.5, prompt: `<p>Un prisme droit a pour base un <b>hexagone</b>. Complète.</p>`, fields: [num1("Nombre de faces :", 8), num1("Nombre d'arêtes :", 18), num1("Nombre de sommets :", 12)], explain: "2 bases + 6 faces latérales = 8 faces. 6 arêtes par base × 2 + 6 arêtes latérales = 18. 6 sommets × 2 = 12." });
addS("m-alt", "maths", "Géométrie", { type: "qcm", pts: 1, prompt: `<p>Deux droites parallèles sont coupées par une sécante. Deux angles <b>alternes-internes</b> sont toujours…</p>`, options: ["de même amplitude", "supplémentaires (somme 180°)", "complémentaires (somme 90°)", "droits"], answer: 0, explain: "Avec des droites parallèles, les angles alternes-internes (et correspondants) ont la même amplitude." });
addS("m-quadsum", "maths", "Géométrie", { type: "num", pts: 1, prompt: `<p>Un quadrilatère a trois angles de 75°, 110° et 95°. Quelle est l'amplitude du quatrième angle ?</p>`, fields: [num1("Angle :", 80, "80°", { suf: "°" })], explain: "La somme des angles d'un quadrilatère vaut 360°. 360 − 75 − 110 − 95 = 80°." });
addS("m-mediatrice", "maths", "Géométrie", { type: "qcm", pts: 1, prompt: `<p>La <b>médiatrice</b> d'un segment est la droite…</p>`, options: ["perpendiculaire au segment et passant par son milieu", "qui passe par un sommet et le milieu du côté opposé", "qui partage un angle en deux angles égaux", "parallèle au segment"], answer: 0, explain: "Tout point de la médiatrice est à égale distance des deux extrémités du segment." });
addS("m-compare", "maths", "Nombres", { type: "qcm", pts: 1, prompt: `<p>Quel est le <b>plus grand</b> de ces nombres ?</p>`, options: [`${MIN}1/3`, `${MIN}0,35`, `${MIN}2/5`, `${MIN}0,5`], answer: 0, explain: "−1/3 ≈ −0,333 ; −0,35 ; −2/5 = −0,4 ; −0,5. Pour les négatifs, le plus grand est le plus proche de 0 : −1/3." });
addS("m-mult6", "maths", "Nombres", { type: "multi", pts: 1.5, prompt: `<p>Coche <b>tous</b> les multiples de 6.</p>`, options: ["42", "78", "96", "56", "100", "63"], answers: [0, 1, 2], explain: "Un multiple de 6 est pair ET multiple de 3 (somme des chiffres divisible par 3). 56 et 100 ne sont pas multiples de 3 ; 63 est impair." });
addS("m-inverse", "maths", "Nombres", { type: "match", pts: 1.5, prompt: `<p>Associe chaque nombre à son <b>opposé</b> ou à son <b>inverse</b> comme demandé.</p>`, items: [{ left: "L'opposé de −7", answer: "7" }, { left: "L'inverse de 2/3", answer: "3/2" }, { left: "L'inverse de −4", answer: "−1/4" }, { left: "L'opposé de 3/5", answer: "−3/5" }], choices: ["7", "−7", "3/2", "−2/3", "−1/4", "4", "−3/5", "5/3"], explain: "Opposé : on change le signe (somme = 0). Inverse : 1 divisé par le nombre (produit = 1)." });
addS("m-vocab", "maths", "Algèbre", { type: "match", pts: 1.5, prompt: `<p>Traduis chaque phrase par une expression.</p>`, items: [{ left: "Le double de x augmenté de 3", answer: "2x + 3" }, { left: "Le double de (x augmenté de 3)", answer: "2(x + 3)" }, { left: "Le carré de x diminué de 3", answer: "x² − 3" }, { left: "Le triple du carré de x", answer: "3x²" }], choices: ["2x + 3", "2(x + 3)", "x² − 3", "(x − 3)²", "3x²", "(3x)²"], explain: "L'ordre des mots indique l'ordre des opérations : « le double de x augmenté de 3 » = on double d'abord, puis on ajoute 3." });
addS("m-graph", "maths", "Traitement de données", { type: "qcm", pts: 1, prompt: `<p>Le graphique d'une situation de proportionnalité est…</p>`, options: ["une droite qui passe par l'origine", "une droite qui ne passe pas par l'origine", "une courbe", "une droite horizontale"], answer: 0, explain: "Si y = k·x, alors pour x = 0 on a y = 0 : la droite passe par l'origine." });
// sciences
addS("s-palier", "sciences", "Matière", { type: "qcm", pts: 1, prompt: `<p>Pendant le palier de fusion d'un corps pur, la substance est…</p>`, options: ["à la fois solide et liquide, à température constante", "entièrement liquide et sa température augmente", "entièrement solide et sa température baisse", "gazeuse"], answer: 0, explain: "Pendant le palier, l'énergie reçue sert à changer d'état, pas à chauffer : la température reste constante." });
addS("s-part", "sciences", "Matière", { type: "match", pts: 1.5, prompt: `<p>Associe chaque état à la description de ses particules.</p>`, items: [{ left: "Solide", answer: "Collées, ordonnées, vibrent sur place" }, { left: "Liquide", answer: "Proches, désordonnées, glissent les unes sur les autres" }, { left: "Gaz", answer: "Éloignées, désordonnées, très agitées" }], choices: ["Collées, ordonnées, vibrent sur place", "Proches, désordonnées, glissent les unes sur les autres", "Éloignées, désordonnées, très agitées"], explain: "C'est le modèle particulaire : plus on chauffe, plus les particules s'agitent et s'éloignent." });
addS("s-masse", "sciences", "Matière", { type: "qcm", pts: 1, prompt: `<p>On fait fondre complètement 50 g de glace dans un récipient fermé. Quelle est la masse d'eau liquide obtenue ?</p>`, options: ["50 g", "Plus de 50 g", "Moins de 50 g", "On ne peut pas savoir"], answer: 0, explain: "Lors d'un changement d'état, la masse se conserve : les particules sont les mêmes, seule leur disposition change. (Le volume, lui, change.)" });
addS("s-gaz", "sciences", "Matière", { type: "multi", pts: 1.5, prompt: `<p>Coche les propositions <b>vraies</b> au sujet des gaz.</p>`, options: ["Un gaz occupe tout l'espace disponible.", "Un gaz peut être comprimé.", "Un gaz a une masse.", "Un gaz a une forme propre."], answers: [0, 1, 2], explain: "Un gaz n'a ni forme ni volume propres, il est compressible et il a bien une masse (1 L d'air ≈ 1,2 g)." });
addS("s-pur", "sciences", "Matière", { type: "qcm", pts: 1, prompt: `<p>L'eau <b>distillée</b> est…</p>`, options: ["un corps pur", "un mélange homogène", "un mélange hétérogène", "une solution"], answer: 0, explain: "La distillation ne laisse que de l'eau : une seule substance, donc un corps pur. L'eau du robinet, elle, est un mélange (sels minéraux dissous)." });
addS("s-flotte", "sciences", "Matière", { type: "qcm", pts: 1, prompt: `<p>La masse volumique de l'eau vaut 1 g/cm³. Un objet de masse volumique 0,8 g/cm³ placé dans l'eau…</p>`, options: ["flotte", "coule", "reste entre deux eaux", "se dissout"], answer: 0, explain: "Un objet moins dense que l'eau (ρ < 1 g/cm³) flotte." });
addS("s-photo", "sciences", "Vivant", { type: "multi", pts: 1.5, prompt: `<p>De quoi une plante verte a-t-elle besoin pour réaliser la <b>photosynthèse</b> ? Coche tout ce qui convient.</p>`, options: ["De la lumière", "De l'eau", "Du dioxyde de carbone", "Du dioxygène", "Du sucre venant du sol"], answers: [0, 1, 2], explain: "Lumière + eau + CO₂ (+ sels minéraux) → matière organique (glucose) + dioxygène rejeté. Le dioxygène est produit, pas consommé par la photosynthèse." });
addS("s-prod", "sciences", "Vivant", { type: "qcm", pts: 1, prompt: `<p>Dans un écosystème, les <b>producteurs</b> sont…</p>`, options: ["les végétaux chlorophylliens", "les herbivores", "les décomposeurs", "les carnivores"], answer: 0, explain: "Ils fabriquent leur propre matière organique grâce à la lumière (photosynthèse)." });
addS("s-decomp", "sciences", "Vivant", { type: "qcm", pts: 1, prompt: `<p>Quel est le rôle des <b>décomposeurs</b> (champignons, bactéries, vers de terre…) ?</p>`, options: ["Transformer la matière organique morte en matière minérale", "Fabriquer de la matière organique grâce à la lumière", "Manger les herbivores", "Polliniser les fleurs"], answer: 0, explain: "Ils recyclent la matière : les sels minéraux libérés seront à nouveau utilisés par les plantes." });
addS("s-fleur", "sciences", "Vivant", { type: "match", pts: 1.5, prompt: `<p>Associe chaque partie de la fleur à son rôle.</p>`, items: [{ left: "Étamine", answer: "Produit le pollen (organe mâle)" }, { left: "Pistil", answer: "Contient les ovules (organe femelle)" }, { left: "Pétales", answer: "Attirent les insectes pollinisateurs" }, { left: "Sépales", answer: "Protègent le bouton floral" }], choices: ["Produit le pollen (organe mâle)", "Contient les ovules (organe femelle)", "Attirent les insectes pollinisateurs", "Protègent le bouton floral"], explain: "Après la pollinisation et la fécondation, l'ovule devient graine et le pistil devient fruit." });
addS("s-pollin", "sciences", "Vivant", { type: "qcm", pts: 1, prompt: `<p>La <b>pollinisation</b>, c'est…</p>`, options: ["le transport du pollen des étamines jusqu'au pistil", "la transformation de la fleur en fruit", "la germination de la graine", "la chute des feuilles"], answer: 0, explain: "Le pollen est transporté par le vent ou les animaux (insectes surtout). Elle précède la fécondation." });
addS("s-vert", "sciences", "Vivant", { type: "qcm", pts: 1, prompt: `<p>Quel critère permet de dire qu'un animal est un <b>vertébré</b> ?</p>`, options: ["Il possède une colonne vertébrale", "Il possède des pattes", "Il vit sur la terre ferme", "Il a le sang chaud"], answer: 0, explain: "Un vertébré a un squelette interne avec une colonne vertébrale (poissons, amphibiens, reptiles, oiseaux, mammifères)." });
addS("s-cell", "sciences", "Vivant", { type: "qcm", pts: 1, prompt: `<p>Quelle affirmation est correcte ?</p>`, options: ["Tous les êtres vivants sont constitués d'une ou plusieurs cellules.", "Seuls les animaux sont constitués de cellules.", "Les plantes n'ont pas de cellules.", "Une cellule est visible à l'œil nu dans tous les cas."], answer: 0, explain: "La cellule est l'unité de base du vivant ; on l'observe généralement au microscope." });
addS("s-champi", "sciences", "Vivant", { type: "qcm", pts: 1, prompt: `<p>Un champignon n'est pas un producteur car…</p>`, options: ["il ne possède pas de chlorophylle", "il pousse dans l'ombre", "il n'a pas de racines", "il est trop petit"], answer: 0, explain: "Sans chlorophylle, pas de photosynthèse : le champignon se nourrit de matière organique (souvent morte) → décomposeur." });
addS("s-alv", "sciences", "Organisme humain", { type: "qcm", pts: 1, prompt: `<p>Où se font les échanges de gaz entre l'air et le sang ?</p>`, options: ["Dans les alvéoles pulmonaires", "Dans la trachée", "Dans le cœur", "Dans l'estomac"], answer: 0, explain: "Les alvéoles ont une paroi très fine entourée de capillaires : le dioxygène passe dans le sang, le CO₂ passe dans l'air." });
addS("s-gr", "sciences", "Organisme humain", { type: "qcm", pts: 1, prompt: `<p>Quels éléments du sang transportent le <b>dioxygène</b> ?</p>`, options: ["Les globules rouges", "Les globules blancs", "Les plaquettes", "Le plasma seul"], answer: 0, explain: "Les globules rouges contiennent l'hémoglobine qui fixe le dioxygène. Les globules blancs défendent l'organisme, les plaquettes servent à la coagulation." });
addS("s-absorp", "sciences", "Organisme humain", { type: "qcm", pts: 1, prompt: `<p>Dans quel organe les nutriments passent-ils principalement dans le sang ?</p>`, options: ["L'intestin grêle", "L'estomac", "L'œsophage", "Le gros intestin"], answer: 0, explain: "C'est l'absorption intestinale : la paroi de l'intestin grêle est très longue et plissée (villosités)." });
addS("s-air", "sciences", "Organisme humain", { type: "match", pts: 1.5, prompt: `<p>Compare l'air <b>expiré</b> à l'air <b>inspiré</b>. L'air expiré contient…</p>`, items: [{ left: "Dioxygène", answer: "Moins" }, { left: "Dioxyde de carbone", answer: "Plus" }, { left: "Vapeur d'eau", answer: "Plus" }, { left: "Diazote", answer: "Autant" }], choices: ["Plus", "Moins", "Autant"], explain: "Le corps consomme du dioxygène et rejette du CO₂ et de la vapeur d'eau ; le diazote n'est pas utilisé." });
addS("s-veine", "sciences", "Organisme humain", { type: "qcm", pts: 1, prompt: `<p>Les <b>veines</b> sont les vaisseaux sanguins qui…</p>`, options: ["ramènent le sang vers le cœur", "partent du cœur vers les organes", "relient les alvéoles à l'estomac", "transportent uniquement de l'air"], answer: 0, explain: "Artères : le sang part du cœur. Veines : le sang revient au cœur. Capillaires : échanges avec les cellules." });
addS("s-coeur", "sciences", "Organisme humain", { type: "qcm", pts: 1, prompt: `<p>Le ventricule <b>gauche</b> du cœur envoie le sang…</p>`, options: ["vers tous les organes du corps (par l'aorte)", "vers les poumons", "vers l'oreillette droite", "vers le foie uniquement"], answer: 0, explain: "Cœur gauche : sang riche en dioxygène envoyé à tout le corps. Cœur droit : sang envoyé aux poumons." });
addS("s-renouv", "sciences", "Énergie", { type: "multi", pts: 1.5, prompt: `<p>Coche les sources d'énergie <b>renouvelables</b>.</p>`, options: ["Le soleil", "Le vent", "La biomasse (bois)", "Le pétrole", "Le gaz naturel", "L'uranium"], answers: [0, 1, 2], explain: "Renouvelable = qui se reconstitue rapidement à l'échelle humaine. Pétrole, gaz et uranium sont des stocks épuisables." });
addS("s-conduc", "sciences", "Énergie", { type: "qcm", pts: 1, prompt: `<p>On laisse une cuillère en métal dans une soupe chaude. Après un moment, le manche est chaud. Ce transfert de chaleur s'appelle…</p>`, options: ["la conduction", "la convection", "le rayonnement", "l'évaporation"], answer: 0, explain: "La chaleur se transmet de proche en proche dans la matière solide : c'est la conduction. Les métaux sont de bons conducteurs." });
addS("s-serie", "sciences", "Énergie", { type: "qcm", pts: 1, prompt: `<p>Deux lampes sont branchées <b>en série</b>. Une lampe grille. Que se passe-t-il ?</p>`, options: ["L'autre lampe s'éteint aussi", "L'autre lampe brille davantage", "L'autre lampe continue de briller normalement", "La pile explose"], answer: 0, explain: "En série, il n'y a qu'un seul chemin pour le courant : si le circuit est ouvert, plus rien ne fonctionne. En dérivation, l'autre lampe resterait allumée." });
addS("s-isol", "sciences", "Énergie", { type: "qcm", pts: 1, prompt: `<p>Lequel de ces matériaux est le meilleur <b>isolant thermique</b> ?</p>`, options: ["La laine de verre", "Le cuivre", "L'aluminium", "Le fer"], answer: 0, explain: "Les isolants emprisonnent de l'air, mauvais conducteur de chaleur. Les métaux sont de bons conducteurs." });
addS("s-temoin", "sciences", "Démarche scientifique", { type: "qcm", pts: 1, prompt: `<p>Dans une expérience, à quoi sert le montage <b>témoin</b> ?</p>`, options: ["À comparer, pour montrer l'effet du seul facteur étudié", "À recommencer l'expérience si elle rate", "À mesurer la température de la pièce", "À rien, il est facultatif"], answer: 0, explain: "Le témoin est identique au montage testé sauf pour UN facteur : on peut alors attribuer la différence de résultat à ce facteur." });
addS("s-hypo", "sciences", "Démarche scientifique", { type: "qcm", pts: 1, prompt: `<p>Une <b>hypothèse</b>, c'est…</p>`, options: ["une réponse possible à une question, qu'on va vérifier par une expérience", "le résultat final d'une expérience", "le matériel nécessaire", "une loi toujours vraie"], answer: 0, explain: "Démarche : question → hypothèse → expérience → résultats → conclusion (hypothèse confirmée ou rejetée)." });
addS("s-facteur", "sciences", "Démarche scientifique", { type: "qcm", pts: 1, prompt: `<p>Pour savoir si la lumière influence la croissance d'une plante, Tom compare deux plantes. Que doit-il faire ?</p>`, options: ["Placer une plante à la lumière et une dans l'obscurité, tout le reste identique", "Arroser une plante et pas l'autre", "Mettre une plante au soleil et une au frigo", "Utiliser deux espèces de plantes différentes"], answer: 0, explain: "On ne change qu'un seul facteur à la fois (ici la lumière) ; sinon on ne sait pas quelle différence explique le résultat." });
addG("sciences", "Air, eau et sol", () => { const V = ri(30, 90), o = 0.21 * V; return { type: "num", pts: 1, prompt: `<p>L'air contient environ 21 % de dioxygène.</p><p>Quel volume de dioxygène y a-t-il dans une classe de ${V} m³ d'air ?</p>`, fields: [num1("Volume de dioxygène :", o, fmt(o) + " m³", { tol: 0.06, suf: "m³" })], explain: `21 % de ${V} = ${V} × 0,21 = <b>${fmt(o)} m³</b>.` }; });
addS("s-aircomp", "sciences", "Air, eau et sol", { type: "qcm", pts: 1, prompt: `<p>Quelle est la composition approximative de l'air sec ?</p>`, options: ["78 % de diazote, 21 % de dioxygène, 1 % d'autres gaz", "78 % de dioxygène, 21 % de diazote, 1 % d'autres gaz", "50 % de dioxygène, 50 % de dioxyde de carbone", "100 % de dioxygène"], answer: 0, explain: "Le diazote est le gaz le plus abondant. Le dioxyde de carbone ne représente qu'environ 0,04 %." });
addS("s-cycle", "sciences", "Air, eau et sol", { type: "order", pts: 1.5, prompt: `<p>Remets dans l'ordre les étapes du cycle de l'eau, en partant de l'océan.</p>`, items: ["Évaporation de l'eau des océans", "Condensation de la vapeur en nuages", "Précipitations (pluie, neige)", "Ruissellement et infiltration vers les rivières et les nappes"], explain: "Le Soleil fournit l'énergie de l'évaporation ; la vapeur se refroidit en altitude et se condense ; l'eau retombe puis rejoint la mer." });
addS("s-humus", "sciences", "Air, eau et sol", { type: "qcm", pts: 1, prompt: `<p>L'<b>humus</b>, la couche sombre à la surface du sol, provient…</p>`, options: ["de la décomposition des feuilles et des êtres vivants morts", "de l'érosion de la roche", "des pluies acides", "du sable apporté par le vent"], answer: 0, explain: "Les décomposeurs transforment la matière organique morte en humus, riche en éléments nutritifs pour les plantes." });
addS("s-perm", "sciences", "Air, eau et sol", { type: "qcm", pts: 1, prompt: `<p>On verse la même quantité d'eau sur du sable et sur de l'argile. Quel sol laisse passer l'eau le plus vite ?</p>`, options: ["Le sable", "L'argile", "Les deux de la même façon", "Aucun des deux"], answer: 0, explain: "Le sable a de gros grains avec beaucoup d'espace entre eux : il est perméable. L'argile, aux grains très fins, retient l'eau." });
addS("s-epur", "sciences", "Air, eau et sol", { type: "qcm", pts: 1, prompt: `<p>À quoi sert une station d'épuration ?</p>`, options: ["À nettoyer les eaux usées avant de les rejeter dans la rivière", "À fabriquer de l'eau salée", "À produire de l'électricité", "À stocker l'eau de pluie pour la boire directement"], answer: 0, explain: "Elle retire les déchets et une grande partie des polluants des eaux usées pour protéger les rivières." });
addS("s-serre", "sciences", "L'homme et l'environnement", { type: "qcm", pts: 1, prompt: `<p>Quel gaz, rejeté en grande quantité par les activités humaines (voitures, chauffage, usines), renforce le plus l'effet de serre ?</p>`, options: ["Le dioxyde de carbone", "Le dioxygène", "Le diazote", "L'hélium"], answer: 0, explain: "La combustion des énergies fossiles (pétrole, gaz, charbon) rejette du CO₂, qui retient une partie de la chaleur de la Terre." });
addS("s-gestes", "sciences", "L'homme et l'environnement", { type: "multi", pts: 1.5, prompt: `<p>Coche les gestes qui <b>réduisent</b> les émissions de dioxyde de carbone.</p>`, options: ["Aller à l'école à vélo ou à pied", "Baisser le chauffage d'un degré", "Manger des fruits et légumes de saison produits près de chez soi", "Laisser les appareils en veille", "Prendre l'avion pour de courts trajets"], answers: [0, 1, 2], explain: "Moins de carburant et moins d'énergie consommés = moins de CO₂. Les appareils en veille consomment de l'électricité ; l'avion émet beaucoup de CO₂ par passager." });
addS("s-tri", "sciences", "L'homme et l'environnement", { type: "match", pts: 2, prompt: `<p>Dans quelle poubelle ou quel conteneur jettes-tu chaque déchet ?</p>`, items: [{ left: "Bouteille d'eau en plastique", answer: "Sac PMD" }, { left: "Canette de soda", answer: "Sac PMD" }, { left: "Vieux journal", answer: "Papiers-cartons" }, { left: "Bocal de confiture en verre", answer: "Bulle à verre" }, { left: "Épluchures de pommes de terre", answer: "Déchets organiques" }], choices: ["Sac PMD", "Papiers-cartons", "Bulle à verre", "Déchets organiques", "Sac tout-venant"], explain: "PMD = Plastiques, Métaux et cartons à boissons. Le tri permet de recycler la matière au lieu de la brûler ou de l'enfouir." });
addS("s-biodiv", "sciences", "L'homme et l'environnement", { type: "qcm", pts: 1, prompt: `<p>Quelle est aujourd'hui l'une des principales causes de la diminution de la biodiversité ?</p>`, options: ["La destruction des milieux de vie (déforestation, bétonnage)", "L'augmentation du nombre de décomposeurs", "La photosynthèse", "La pollinisation par les abeilles"], answer: 0, explain: "Quand un milieu disparaît, les espèces qui y vivent perdent leur nourriture et leur abri." });
// ouvertes sciences
const OPEN_S = [
  { theme: "Démarche scientifique", p: `<p>Tu veux vérifier que les graines ont besoin d'<b>eau</b> pour germer. Tu disposes de graines de haricot, de coton et de deux boîtes.</p><p><b>Décris l'expérience que tu réalises</b> et le résultat qui confirmerait ton hypothèse.</p>`, m: `Je prépare deux boîtes identiques avec du coton et le même nombre de graines, à la même température et à la même lumière. Boîte 1 : j'humidifie le coton. Boîte 2 (témoin) : je laisse le coton sec. Seule la présence d'eau change. Après quelques jours, si seules les graines de la boîte 1 ont germé, l'eau est nécessaire à la germination.`, c: ["prévoit deux montages dont un témoin (1 pt)", "un seul facteur change (l'eau), les autres conditions sont identiques (1 pt)", "décrit le résultat attendu et la conclusion (1 pt)"] },
  { theme: "Vivant", p: `<p>Une plante verte est placée pendant trois semaines dans une armoire complètement noire. Elle jaunit puis dépérit.</p><p><b>Explique pourquoi.</b></p>`, m: `Sans lumière, la plante ne peut pas réaliser la photosynthèse. Elle ne fabrique donc plus de matière organique (glucose) dont elle a besoin pour vivre et grandir. Elle utilise ses réserves puis dépérit.`, c: ["cite la photosynthèse (1 pt)", "indique que la lumière est indispensable à la photosynthèse (1 pt)", "explique que la plante ne produit plus sa matière organique/nourriture (1 pt)"] },
  { theme: "Organisme humain", p: `<p>Quand tu cours, tu respires plus vite et ton cœur bat plus vite.</p><p><b>Explique pourquoi.</b></p>`, m: `Pendant l'effort, les muscles travaillent plus et ont besoin de plus d'énergie. Pour la produire, ils consomment plus de dioxygène et de nutriments (glucose), apportés par le sang. La respiration accélère pour faire entrer plus de dioxygène et rejeter le CO₂ produit ; le cœur accélère pour faire circuler le sang plus vite vers les muscles.`, c: ["les muscles ont besoin de plus d'énergie (1 pt)", "ils consomment plus de dioxygène/nutriments et rejettent plus de CO₂ (1 pt)", "rôle du cœur (circulation plus rapide) et de la respiration (plus d'O₂ apporté) (1 pt)"] },
  { theme: "Matière", p: `<p>Un glaçon flotte dans un verre d'eau.</p><p><b>Explique pourquoi</b> en utilisant la notion de masse volumique.</p>`, m: `La masse volumique de la glace (environ 0,92 g/cm³) est plus petite que celle de l'eau liquide (1 g/cm³). Un objet moins dense que le liquide dans lequel il est placé flotte. Quand l'eau gèle, son volume augmente alors que sa masse reste la même, donc sa masse volumique diminue.`, c: ["compare les masses volumiques glace/eau (1 pt)", "énonce : moins dense que le liquide → flotte (1 pt)", "valeurs correctes ou explication (volume qui augmente au gel) (1 pt)"] },
  { theme: "Vivant", p: `<p>Dans une prairie : l'herbe est mangée par les lapins, et les lapins par les renards.</p><p>Une maladie fait disparaître presque tous les lapins. <b>Que va-t-il arriver aux renards et à l'herbe ? Explique.</b></p>`, m: `Les renards vont diminuer car ils n'ont plus assez de nourriture (ou devront chercher d'autres proies). L'herbe va augmenter car elle n'est presque plus mangée. Dans un réseau alimentaire, la disparition d'un maillon a des conséquences sur les autres.`, c: ["renards diminuent, avec explication (manque de nourriture) (1 pt)", "herbe augmente, avec explication (moins consommée) (1 pt)", "idée d'interdépendance des êtres vivants dans la chaîne (1 pt)"] },
  { theme: "Matière", p: `<p>Tu as de l'eau salée. <b>Comment peux-tu récupérer le sel ?</b> Explique aussi pourquoi une filtration ne fonctionne pas.</p>`, m: `L'eau salée est un mélange homogène : le sel est dissous. Je fais chauffer (ou je laisse à l'air libre) pour évaporer l'eau : le sel reste au fond du récipient. La filtration ne marche pas car le sel dissous passe à travers le filtre avec l'eau ; elle ne retient que les solides non dissous.`, c: ["propose l'évaporation (ou la distillation) (1 pt)", "explique que l'eau s'évapore et que le sel reste (1 pt)", "explique que le sel est dissous (mélange homogène) et passe à travers le filtre (1 pt)"] },
  { theme: "L'homme et l'environnement", p: `<p>Des forêts sont abattues pour agrandir des champs.</p><p><b>Explique pourquoi cela peut renforcer l'effet de serre.</b></p>`, m: `Les arbres absorbent du dioxyde de carbone pour réaliser la photosynthèse. Si on les abat, moins de CO₂ est retiré de l'air. De plus, si le bois est brûlé, il rejette du CO₂. Plus de CO₂ dans l'air renforce l'effet de serre et le réchauffement climatique.`, c: ["les arbres absorbent du CO₂ par la photosynthèse (1 pt)", "moins d'arbres → plus de CO₂ dans l'air (ou CO₂ rejeté si le bois brûle) (1 pt)", "lien CO₂ – effet de serre – réchauffement (1 pt)"] },
  { theme: "Énergie", p: `<p>En hiver, une doudoune garde bien au chaud.</p><p><b>Explique comment elle fonctionne</b> du point de vue des transferts de chaleur.</p>`, m: `La doudoune ne produit pas de chaleur. Elle contient beaucoup d'air emprisonné (plumes, fibres) qui est un mauvais conducteur de chaleur : c'est un isolant thermique. Elle ralentit donc le transfert de chaleur du corps (chaud) vers l'extérieur (froid).`, c: ["la doudoune ne produit pas de chaleur, c'est le corps (1 pt)", "elle contient de l'air emprisonné, isolant (1 pt)", "elle limite le transfert de chaleur du chaud (corps) vers le froid (extérieur) (1 pt)"] },
];
OPEN_S.forEach((o, i) => addS("s-open" + i, "sciences", "Justifier", { type: "open", pts: 3, prompt: o.p, model: o.m, criteria: o.c, explain: "", realTheme: o.theme }));

addS("m-puiss", "maths", "Nombres", { type: "num", pts: 1, prompt: `<p>Calcule en utilisant les propriétés des puissances.</p><div class="expr">2³ × 2²</div>`, fields: [num1("=", 32)], explain: "On garde la base et on additionne les exposants : 2³ × 2² = 2⁵ = 32." });
addS("m-arrondi", "maths", "Nombres", { type: "num", pts: 1, prompt: `<p>Arrondis <b>3,468</b> au dixième.</p>`, fields: [num1("≈", 3.5, "3,5")], explain: "Le chiffre des centièmes (6) est ≥ 5 : on arrondit le dixième vers le haut, 3,5." });
addS("m-premier", "maths", "Nombres", { type: "qcm", pts: 1, prompt: `<p>Lequel de ces nombres est un <b>nombre premier</b> ?</p>`, options: ["29", "21", "27", "33"], answer: 0, explain: "29 n'a que deux diviseurs : 1 et 29. 21 = 3 × 7, 27 = 3 × 9, 33 = 3 × 11." });
addS("m-pgcd", "maths", "Nombres", { type: "num", pts: 1.5, prompt: `<p>Complète.</p>`, fields: [num1("PGCD de 24 et 36 =", 12), num1("PPCM de 6 et 8 =", 24)], explain: "Diviseurs communs de 24 et 36 : 1, 2, 3, 4, 6, 12 → le plus grand est 12. Multiples communs de 6 et 8 : 24, 48… → le plus petit est 24." });
addS("m-pct", "maths", "Grandeurs", { type: "num", pts: 1, prompt: `<p>Calcule <b>25 % de 80</b>.</p>`, fields: [num1("=", 20)], explain: "25 % = 1/4. Un quart de 80 = 20." });
addS("m-cube", "maths", "Géométrie", { type: "num", pts: 1.5, prompt: `<p>Complète pour un <b>cube</b>.</p>`, fields: [num1("Nombre de faces :", 6), num1("Nombre d'arêtes :", 12), num1("Nombre de sommets :", 8)], explain: "Un cube a 6 faces carrées, 12 arêtes et 8 sommets." });
addS("m-inegal", "maths", "Géométrie", { type: "qcm", pts: 1, prompt: `<p>Peut-on construire un triangle dont les côtés mesurent 3 cm, 4 cm et 9 cm ?</p>`, options: ["Non, car 3 + 4 est plus petit que 9", "Oui, n'importe quelles longueurs conviennent", "Oui, c'est un triangle rectangle", "Non, car 9 n'est pas un multiple de 3"], answer: 0, explain: "Dans un triangle, chaque côté est plus petit que la somme des deux autres. Ici 3 + 4 = 7 < 9 : impossible." });
addS("m-droites", "maths", "Géométrie", { type: "match", pts: 1.5, prompt: `<p>Associe chaque droite remarquable du triangle à sa définition.</p>`, items: [{ left: "Hauteur", answer: "Passe par un sommet, perpendiculaire au côté opposé" }, { left: "Médiane", answer: "Passe par un sommet et le milieu du côté opposé" }, { left: "Bissectrice", answer: "Partage un angle en deux angles égaux" }, { left: "Médiatrice", answer: "Perpendiculaire à un côté en son milieu" }], choices: ["Passe par un sommet, perpendiculaire au côté opposé", "Passe par un sommet et le milieu du côté opposé", "Partage un angle en deux angles égaux", "Perpendiculaire à un côté en son milieu"], explain: "Hauteur : angle droit. Médiane : milieu. Bissectrice : angle coupé en deux. Médiatrice : milieu ET angle droit." });
addS("m-sym", "maths", "Géométrie", { type: "multi", pts: 1.5, prompt: `<p>Une symétrie centrale (ou orthogonale) conserve… Coche tout ce qui convient.</p>`, options: ["les longueurs", "l'amplitude des angles", "l'alignement des points", "la position de la figure"], answers: [0, 1, 2], explain: "Les isométries conservent longueurs, angles, parallélisme et alignement. La figure change de place." });
addS("m-moyinv", "maths", "Traitement de données", { type: "num", pts: 1, prompt: `<p>La moyenne de 4 notes est 12. Quelle est la somme de ces 4 notes ?</p>`, fields: [num1("Somme :", 48)], explain: "Moyenne = somme : nombre de notes, donc somme = 12 × 4 = 48." });
addS("m-effectif", "maths", "Traitement de données", { type: "qcm", pts: 1, prompt: `<p>Dans une enquête, 8 élèves sur 32 préfèrent le basket. Quelle est la <b>fréquence</b> de cette réponse ?</p>`, options: ["25 %", "8 %", "32 %", "4 %"], answer: 0, explain: "Fréquence = effectif : effectif total = 8 : 32 = 0,25 = 25 %." });

/* ============ SCIENCES : questions fixes supplémentaires ============ */
addS("s-diss", "sciences", "Matière", { type: "qcm", pts: 1, prompt: `<p>On dissout du sucre dans de l'eau. Le sucre…</p>`, options: ["est toujours présent, dispersé dans l'eau", "a disparu", "s'est transformé en eau", "est devenu un gaz"], answer: 0, explain: "C'est une dissolution : l'eau a toujours un goût sucré et la masse totale est conservée." });
addS("s-eprou", "sciences", "Matière", { type: "match", pts: 1.5, prompt: `<p>Quel instrument utilise-t-on pour mesurer…</p>`, items: [{ left: "le volume d'un liquide", answer: "Une éprouvette graduée" }, { left: "la masse d'un objet", answer: "Une balance" }, { left: "la température", answer: "Un thermomètre" }, { left: "une durée", answer: "Un chronomètre" }], choices: ["Une éprouvette graduée", "Une balance", "Un thermomètre", "Un chronomètre", "Une règle"], explain: "Chaque grandeur a son instrument et son unité : volume (mL), masse (g), température (°C), durée (s)." });
addS("s-caillou", "sciences", "Matière", { type: "qcm", pts: 1, prompt: `<p>Une éprouvette contient 50 mL d'eau. On y plonge un caillou : le niveau monte à 68 mL. Quel est le volume du caillou ?</p>`, options: ["18 cm³", "68 cm³", "50 cm³", "118 cm³"], answer: 0, explain: "Le caillou déplace son propre volume d'eau : 68 − 50 = 18 mL = 18 cm³." });
addS("s-buee", "sciences", "Matière", { type: "qcm", pts: 1, prompt: `<p>De la buée apparaît sur un miroir froid après une douche chaude. C'est…</p>`, options: ["la vapeur d'eau de l'air qui se liquéfie", "l'eau du miroir qui s'évapore", "une transformation chimique", "de la fumée"], answer: 0, explain: "La vapeur d'eau (gaz, invisible) se refroidit au contact du miroir et redevient liquide : liquéfaction (condensation)." });
addS("s-germ", "sciences", "Vivant", { type: "multi", pts: 1.5, prompt: `<p>De quoi une graine a-t-elle besoin pour <b>germer</b> ? Coche tout ce qui convient.</p>`, options: ["D'eau", "D'air (dioxygène)", "D'une température adaptée", "De lumière", "D'engrais"], answers: [0, 1, 2], explain: "La graine contient ses réserves : elle n'a pas besoin de lumière ni d'engrais pour germer. La lumière devient nécessaire ensuite, pour la photosynthèse." });
addS("s-racine", "sciences", "Vivant", { type: "match", pts: 1.5, prompt: `<p>Associe chaque organe de la plante à son rôle principal.</p>`, items: [{ left: "Racines", answer: "Absorbent l'eau et les sels minéraux" }, { left: "Feuilles", answer: "Réalisent la photosynthèse" }, { left: "Tige", answer: "Transporte la sève et soutient la plante" }, { left: "Fleur", answer: "Permet la reproduction" }], choices: ["Absorbent l'eau et les sels minéraux", "Réalisent la photosynthèse", "Transporte la sève et soutient la plante", "Permet la reproduction"], explain: "Racines → absorption ; feuilles → photosynthèse et échanges gazeux ; tige → transport ; fleur → reproduction." });
addS("s-omni", "sciences", "Vivant", { type: "match", pts: 1.5, prompt: `<p>Quel est le régime alimentaire de chaque animal ?</p>`, items: [{ left: "Lapin", answer: "Herbivore" }, { left: "Renard", answer: "Carnivore" }, { left: "Sanglier", answer: "Omnivore" }, { left: "Hérisson", answer: "Insectivore" }], choices: ["Herbivore", "Carnivore", "Omnivore", "Insectivore"], explain: "Herbivore : végétaux. Carnivore : autres animaux. Omnivore : végétaux et animaux. Insectivore : surtout des insectes." });
addS("s-grenouille", "sciences", "Vivant", { type: "order", pts: 1.5, prompt: `<p>Remets dans l'ordre le développement de la grenouille.</p>`, items: ["Œuf", "Têtard sans pattes", "Têtard avec pattes", "Jeune grenouille"], explain: "La grenouille subit une métamorphose : l'animal change fortement de forme au cours de son développement." });
addS("s-hiber", "sciences", "Vivant", { type: "qcm", pts: 1, prompt: `<p>Pourquoi le hérisson hiberne-t-il en hiver ?</p>`, options: ["Parce que sa nourriture (insectes, vers) devient rare", "Parce qu'il a peur de la neige", "Parce qu'il doit pondre ses œufs", "Parce que ses piquants tombent"], answer: 0, explain: "L'hibernation réduit fortement ses besoins en énergie pendant la période où il ne trouve presque rien à manger." });
addS("s-feco", "sciences", "Vivant", { type: "qcm", pts: 1, prompt: `<p>Chez les animaux, la <b>fécondation</b> est…</p>`, options: ["l'union d'un spermatozoïde et d'un ovule", "la ponte des œufs", "la naissance du petit", "le transport du pollen"], answer: 0, explain: "La fécondation donne une cellule-œuf, qui se développe ensuite en embryon." });
addS("s-bouture", "sciences", "Vivant", { type: "qcm", pts: 1, prompt: `<p>On plante un morceau de tige de géranium et il donne une nouvelle plante. Comment s'appelle ce mode de reproduction ?</p>`, options: ["Le bouturage (reproduction asexuée)", "La pollinisation", "La fécondation", "La germination"], answer: 0, explain: "Sans graine ni fécondation : c'est une reproduction asexuée. La nouvelle plante est identique à la plante de départ." });
addS("s-nutri", "sciences", "Organisme humain", { type: "match", pts: 1.5, prompt: `<p>Associe chaque type d'aliment à son rôle principal.</p>`, items: [{ left: "Glucides (pain, pâtes)", answer: "Fournir de l'énergie" }, { left: "Protéines (viande, œufs, lentilles)", answer: "Construire et réparer le corps" }, { left: "Fruits et légumes", answer: "Apporter vitamines et fibres" }, { left: "Eau", answer: "Hydrater l'organisme" }], choices: ["Fournir de l'énergie", "Construire et réparer le corps", "Apporter vitamines et fibres", "Hydrater l'organisme"], explain: "Une alimentation équilibrée combine ces groupes d'aliments chaque jour." });
addS("s-enzyme", "sciences", "Organisme humain", { type: "qcm", pts: 1, prompt: `<p>Pendant la digestion, les sucs digestifs…</p>`, options: ["transforment les aliments en nutriments assez petits pour passer dans le sang", "font passer les aliments directement dans les poumons", "fabriquent de l'oxygène", "détruisent tous les nutriments"], answer: 0, explain: "C'est la digestion chimique. La digestion mécanique (dents, estomac) découpe et brasse les aliments." });
addS("s-muscle", "sciences", "Organisme humain", { type: "qcm", pts: 1, prompt: `<p>Pour plier le bras, le biceps…</p>`, options: ["se contracte et tire sur l'os", "se relâche et pousse l'os", "se transforme en os", "ne joue aucun rôle"], answer: 0, explain: "Un muscle ne peut que tirer en se contractant. Le triceps, de l'autre côté, se contracte pour tendre le bras." });
addS("s-rein", "sciences", "Organisme humain", { type: "qcm", pts: 1, prompt: `<p>Quel est le rôle des <b>reins</b> ?</p>`, options: ["Filtrer le sang et produire l'urine", "Digérer les graisses", "Pomper le sang", "Échanger les gaz respiratoires"], answer: 0, explain: "Les reins éliminent les déchets du sang, qui sont évacués dans l'urine." });
addS("s-sang", "sciences", "Organisme humain", { type: "order", pts: 1.5, prompt: `<p>Remets dans l'ordre le trajet du sang pauvre en dioxygène qui revient des organes.</p>`, items: ["Organes (muscles…)", "Veines caves", "Cœur droit", "Artère pulmonaire", "Poumons"], explain: "Le sang pauvre en dioxygène revient au cœur droit, qui l'envoie aux poumons pour se recharger en dioxygène." });
addS("s-colonne", "sciences", "Organisme humain", { type: "multi", pts: 1.5, prompt: `<p>Quels sont les rôles du squelette ? Coche tout ce qui convient.</p>`, options: ["Soutenir le corps", "Protéger des organes (cerveau, cœur…)", "Permettre le mouvement avec les muscles", "Digérer les aliments"], answers: [0, 1, 2], explain: "Le crâne protège le cerveau, la cage thoracique protège le cœur et les poumons, la colonne vertébrale protège la moelle épinière." });
addS("s-convec", "sciences", "Énergie", { type: "qcm", pts: 1, prompt: `<p>Au-dessus d'un radiateur, l'air chaud monte. Pourquoi ?</p>`, options: ["L'air chaud est moins dense que l'air froid", "L'air chaud est plus lourd", "Le radiateur souffle l'air", "L'air chaud contient plus de dioxygène"], answer: 0, explain: "En se réchauffant, l'air se dilate : sa masse volumique diminue et il monte. C'est la convection." });
addS("s-conducelec", "sciences", "Énergie", { type: "multi", pts: 1.5, prompt: `<p>Coche les matériaux qui conduisent bien le courant électrique.</p>`, options: ["Le cuivre", "L'aluminium", "Le fer", "Le plastique", "Le bois sec", "Le verre"], answers: [0, 1, 2], explain: "Les métaux sont de bons conducteurs. Plastique, bois sec et verre sont des isolants électriques (d'où les gaines en plastique autour des fils)." });
addS("s-circuit", "sciences", "Énergie", { type: "qcm", pts: 1, prompt: `<p>Une lampe s'allume quand…</p>`, options: ["elle fait partie d'un circuit fermé relié aux deux bornes de la pile", "elle touche une seule borne de la pile", "l'interrupteur est ouvert", "le circuit contient un isolant"], answer: 0, explain: "Le courant doit pouvoir circuler en boucle, d'une borne de la pile à l'autre." });
addS("s-hydro", "sciences", "Énergie", { type: "qcm", pts: 1, prompt: `<p>Dans une centrale hydroélectrique, l'énergie est convertie…</p>`, options: ["de l'énergie de mouvement de l'eau en énergie électrique", "de l'énergie électrique en énergie lumineuse", "de l'énergie chimique en énergie thermique", "de l'énergie nucléaire en énergie électrique"], answer: 0, explain: "L'eau qui tombe fait tourner une turbine reliée à un alternateur qui produit de l'électricité." });
addS("s-watt", "sciences", "Énergie", { type: "match", pts: 1.5, prompt: `<p>Associe chaque grandeur à son unité.</p>`, items: [{ left: "Énergie", answer: "Joule (J)" }, { left: "Puissance", answer: "Watt (W)" }, { left: "Température", answer: "Degré Celsius (°C)" }, { left: "Masse", answer: "Kilogramme (kg)" }], choices: ["Joule (J)", "Watt (W)", "Degré Celsius (°C)", "Kilogramme (kg)", "Litre (L)"], explain: "La facture d'électricité compte l'énergie en kilowattheures (kWh), une autre unité d'énergie." });
addS("s-douce", "sciences", "Air, eau et sol", { type: "qcm", pts: 1, prompt: `<p>Environ quelle part de l'eau présente sur Terre est de l'<b>eau douce</b> ?</p>`, options: ["Environ 3 %", "Environ 50 %", "Environ 97 %", "100 %"], answer: 0, explain: "97 % de l'eau est salée (océans). Et la plus grande partie de l'eau douce est gelée dans les glaciers : l'eau potable est précieuse." });
addS("s-nappe", "sciences", "Air, eau et sol", { type: "qcm", pts: 1, prompt: `<p>Une <b>nappe phréatique</b>, c'est…</p>`, options: ["de l'eau souterraine qui remplit les espaces d'une couche de roche ou de sol", "un lac en surface", "un nuage bas", "une rivière qui coule sous un pont"], answer: 0, explain: "L'eau de pluie s'infiltre et s'accumule en profondeur. En Wallonie, une grande partie de l'eau du robinet vient des nappes." });
addS("s-altitude", "sciences", "Air, eau et sol", { type: "qcm", pts: 1, prompt: `<p>Quand on monte en altitude, la pression de l'air…</p>`, options: ["diminue", "augmente", "reste la même", "devient nulle dès 100 m"], answer: 0, explain: "Plus on monte, moins il y a d'air au-dessus de nous : la pression atmosphérique diminue." });
addS("s-erosion", "sciences", "Air, eau et sol", { type: "qcm", pts: 1, prompt: `<p>Qu'est-ce qui protège le mieux un sol en pente contre l'érosion par la pluie ?</p>`, options: ["Une couverture de végétation (herbe, arbres)", "Un sol nu labouré", "Du sable sec", "L'absence de racines"], answer: 0, explain: "Les racines retiennent la terre et les plantes freinent l'eau qui ruisselle." });
addS("s-mer", "sciences", "Air, eau et sol", { type: "qcm", pts: 1, prompt: `<p>Pourquoi ne peut-on pas boire l'eau de mer ?</p>`, options: ["Elle est trop salée pour notre organisme", "Elle est toujours trop froide", "Elle ne contient pas d'eau", "Elle est radioactive"], answer: 0, explain: "Boire de l'eau très salée déshydrate le corps. Il faudrait la dessaler (par exemple par distillation)." });
addS("s-invasive", "sciences", "L'homme et l'environnement", { type: "qcm", pts: 1, prompt: `<p>Une <b>espèce exotique envahissante</b> est…</p>`, options: ["une espèce venue d'ailleurs qui se répand et menace les espèces locales", "une espèce protégée", "une espèce qui a disparu", "un animal domestique"], answer: 0, explain: "Exemples en Belgique : la renouée du Japon ou la coccinelle asiatique, qui concurrencent les espèces d'ici." });
addS("s-eutro", "sciences", "L'homme et l'environnement", { type: "qcm", pts: 1, prompt: `<p>Trop d'engrais agricoles arrivent dans un étang. Que risque-t-il de se passer ?</p>`, options: ["Les algues prolifèrent, puis l'eau manque de dioxygène et les poissons meurent", "Les poissons grandissent plus vite", "L'eau devient potable", "Rien du tout"], answer: 0, explain: "C'est l'eutrophisation : les algues se développent trop, puis leur décomposition consomme le dioxygène de l'eau." });
addS("s-pollair", "sciences", "L'homme et l'environnement", { type: "qcm", pts: 1, prompt: `<p>En ville, quelle est l'une des principales sources de pollution de l'air ?</p>`, options: ["Le trafic routier", "Les arbres des parcs", "Les pistes cyclables", "La pluie"], answer: 0, explain: "Les moteurs rejettent des particules fines et des gaz polluants. Les zones de basses émissions (LEZ) de Bruxelles visent à les réduire." });
addS("s-recy", "sciences", "L'homme et l'environnement", { type: "multi", pts: 1.5, prompt: `<p>Pourquoi est-il utile de recycler le papier ? Coche tout ce qui convient.</p>`, options: ["On coupe moins d'arbres", "On consomme moins d'eau et d'énergie que pour fabriquer du papier neuf", "On produit moins de déchets à brûler", "Le papier recyclé ne s'use jamais"], answers: [0, 1, 2], explain: "Le recyclage économise des ressources. Mais les fibres s'abîment : on ne peut pas recycler le papier à l'infini." });
addS("s-repet", "sciences", "Démarche scientifique", { type: "qcm", pts: 1, prompt: `<p>Pourquoi un scientifique répète-t-il plusieurs fois la même expérience ?</p>`, options: ["Pour vérifier que les résultats sont fiables", "Pour perdre moins de temps", "Pour changer d'hypothèse à chaque fois", "Parce que la première fois est toujours fausse"], answer: 0, explain: "Si l'on obtient des résultats semblables à chaque fois, la conclusion est plus solide." });
addS("s-obs", "sciences", "Démarche scientifique", { type: "qcm", pts: 1, prompt: `<p>Laquelle de ces phrases est une <b>observation</b> (et pas une interprétation) ?</p>`, options: ["Le liquide devient trouble.", "Une réaction chimique a eu lieu.", "Le gaz produit est du dioxyde de carbone.", "La température a sûrement baissé."], answer: 0, explain: "Une observation décrit ce que l'on voit ou mesure. Une interprétation explique ou suppose." });
addS("s-axe", "sciences", "Démarche scientifique", { type: "qcm", pts: 1, prompt: `<p>Dans un graphique, où place-t-on habituellement la variable qu'on fait varier (variable indépendante) ?</p>`, options: ["Sur l'axe horizontal", "Sur l'axe vertical", "Dans le titre", "On ne la place pas"], answer: 0, explain: "Axe horizontal : ce qu'on fait varier (ex. le temps). Axe vertical : ce qu'on mesure. Sans oublier les unités !" });

/* ============ FRANÇAIS ============ */
const TXT_BUS = textBox("Le dernier bus", `Il était dix-neuf heures passées quand Yasmine sortit enfin de la bibliothèque. Le ciel de novembre était déjà noir et une pluie fine faisait briller les pavés de la place. Elle courut jusqu'à l'arrêt, son sac trop lourd rebondissant contre son dos, juste à temps pour voir les feux arrière du 46 disparaître au coin de la rue.
— Évidemment, soupira-t-elle.

Le prochain bus ne passait que dans quarante minutes. Elle aurait pu appeler sa mère, mais elle savait déjà ce qu'elle entendrait : « Je t'avais dit de ne pas rester si tard. » Alors elle s'assit sur le banc mouillé et sortit son cahier de néerlandais. Autant réviser.

Au bout de dix minutes, un vieil homme s'installa à côté d'elle. Il jeta un coup d'œil à son cahier et sourit.
— Goedenavond, dit-il avec un accent parfait. Vous étudiez le néerlandais ?
Yasmine hésita, puis répondit en rougissant : « Ja… een beetje. »

Quand le bus arriva enfin, elle fut presque déçue. En quarante minutes, elle avait appris plus de mots qu'en une semaine de cours.`);
const TXT_ABEILLES = textBox("Les abeilles, bien plus que du miel", `On associe souvent les abeilles au miel. Pourtant, leur rôle le plus important est ailleurs : en passant de fleur en fleur pour récolter le nectar, elles transportent le pollen et permettent la reproduction de nombreuses plantes. Selon l'Organisation des Nations unies pour l'alimentation et l'agriculture (FAO), environ trois quarts des principales cultures alimentaires dans le monde dépendent au moins en partie des pollinisateurs.

En Belgique, on compte environ 400 espèces d'abeilles. La plupart ne vivent pas dans des ruches : ce sont des abeilles sauvages, souvent solitaires, qui nichent dans le sol ou dans des tiges creuses.

Or ces insectes sont menacés. Les pesticides, la disparition des haies et des prairies fleuries, ainsi que certaines maladies réduisent leurs populations. Chacun peut pourtant agir : laisser une partie de son jardin fleurir librement, planter des espèces locales ou installer un « hôtel à insectes » sont des gestes simples qui leur offrent nourriture et abri.`);
const TXT_GSM = textBox("Courrier des lecteurs : faut-il interdire le téléphone à l'école ?", `Depuis quelques années, de plus en plus d'écoles interdisent le téléphone portable, même pendant les récréations. Je suis élève de 3e secondaire et je pense que c'est une bonne décision.

D'abord, sans téléphone, les récréations redeviennent des moments d'échange. Au lieu de fixer un écran, on discute, on joue, on rit ensemble. Ensuite, les notifications nous empêchent de nous concentrer : même éteint dans le sac, le téléphone occupe nos pensées. Enfin, l'interdiction protège les élèves du harcèlement : moins de photos prises en cachette, moins de moqueries qui circulent sur les réseaux pendant la journée.

Certains diront que le téléphone est utile en cas d'urgence. C'est vrai, mais l'école dispose d'un secrétariat et d'un téléphone fixe, et les parents peuvent toujours joindre leur enfant par ce biais.

L'école doit rester un lieu où l'on apprend à vivre ensemble. Poser son téléphone quelques heures par jour, ce n'est pas une punition : c'est une chance.

Inès, 15 ans`);
addS("f-bus", "francais", "Lecture", quiz(6, `<p>Lis le texte puis réponds aux questions.</p>` + TXT_BUS, [
  sq("Pourquoi Yasmine rate-t-elle le bus ?", ["Elle est arrivée à l'arrêt juste trop tard", "Elle s'est trompée d'arrêt", "Le bus était en avance", "Elle attendait sa mère"]),
  sq("Pourquoi n'appelle-t-elle pas sa mère ?", ["Elle ne veut pas entendre de reproche", "Son téléphone n'a plus de batterie", "Sa mère travaille de nuit", "Elle n'a pas de téléphone"]),
  sq("À quelle saison se passe l'histoire ?", ["En automne", "En hiver", "Au printemps", "En été"]),
  sq("« — Évidemment, soupira-t-elle. » Que ressent Yasmine à ce moment ?", ["De l'agacement, avec résignation", "De la joie", "De la peur", "Une bonne surprise"]),
  sq("Que ressent Yasmine à la fin du texte ?", ["Elle regrette presque que l'attente soit finie", "Elle est soulagée de partir enfin", "Elle est fâchée contre le vieil homme", "Elle a peur de rentrer"]),
  sq("Qui raconte l'histoire ?", ["Un narrateur extérieur à l'histoire", "Yasmine", "Le vieil homme", "La mère de Yasmine"]),
], { explain: "Relis toujours la phrase exacte du texte qui justifie ta réponse. Le narrateur dit « elle » : il ne participe pas à l'histoire." }));
addS("f-abeilles", "francais", "Lecture", quiz(6, `<p>Lis le texte puis réponds aux questions.</p>` + TXT_ABEILLES, [
  sq("Selon le texte, quel est le rôle le plus important des abeilles ?", ["Polliniser les plantes", "Produire du miel", "Manger les insectes nuisibles", "Fabriquer de la cire"]),
  sq("Dans le texte, que signifie « solitaires » ?", ["Qui vivent seules, pas en colonie", "Qui sont tristes", "Qui vivent loin des villes", "Qui ne volent pas"]),
  sq("Que fait le troisième paragraphe ?", ["Il présente les menaces et ce qu'on peut faire", "Il décrit la fabrication du miel", "Il raconte une anecdote", "Il donne l'avis d'un apiculteur"]),
  sq("Le mot « Or », au début du 3e paragraphe, introduit…", ["un élément qui s'oppose à ce qui précède", "une conséquence", "un exemple", "une conclusion"]),
  sq("De quel type de texte s'agit-il ?", ["Un texte informatif", "Un récit", "Un poème", "Une recette"]),
  sq("Vrai ou faux : la plupart des abeilles de Belgique vivent dans des ruches.", VF, 1),
], { explain: "Le texte informatif transmet des faits, souvent avec une source (ici, la FAO). Les connecteurs comme « or », « pourtant », « donc » organisent les idées." }));
addS("f-gsm", "francais", "Lecture", quiz(5, `<p>Lis le texte puis réponds aux questions.</p>` + TXT_GSM, [
  sq("Quelle est la thèse d'Inès ?", ["Interdire le téléphone à l'école est une bonne décision", "Le téléphone doit être autorisé partout", "Les parents doivent confisquer les téléphones", "Les récréations sont trop courtes"]),
  sq("Combien d'arguments pour sa thèse donne-t-elle dans le 2e paragraphe ?", ["3", "2", "4", "1"]),
  sq("Quel mot introduit son dernier argument ?", ["Enfin", "D'abord", "Ensuite", "Alors"]),
  sq("Dans le 3e paragraphe, Inès…", ["présente un contre-argument puis le réfute", "donne un nouvel argument", "raconte une anecdote", "change d'avis"]),
  sq("De quel type de texte s'agit-il ?", ["Un texte argumentatif", "Un texte narratif", "Un texte informatif", "Un texte descriptif"]),
], { explain: "Un texte argumentatif défend une thèse avec des arguments (souvent organisés par « d'abord, ensuite, enfin ») et répond parfois à un contre-argument." }));
addS("f-bus-o", "francais", "Écriture", { type: "open", pts: 3, prompt: `<p>Relis le texte.</p>` + TXT_BUS + `<p><b>Le texte dit que Yasmine « fut presque déçue » quand le bus arriva. Explique pourquoi, en t'appuyant sur deux éléments du texte.</b></p>`, model: `Yasmine est presque déçue parce que l'attente, qu'elle trouvait pénible au départ, est devenue un moment agréable et utile. Un vieil homme lui a parlé en néerlandais (« Goedenavond ») et elle lui a répondu. Le texte dit qu'en quarante minutes elle a appris plus de mots qu'en une semaine de cours : elle aurait aimé continuer.`, criteria: ["explique que l'attente est devenue agréable/utile (1 pt)", "cite ou reformule un premier élément du texte (la rencontre avec le vieil homme qui parle néerlandais) (1 pt)", "cite ou reformule un second élément (elle a appris plus de mots qu'en une semaine de cours) (1 pt)"], explain: "" });

const QUOTAS = {
  // répartition calquée sur la circulaire CE1D 2025-2026 : Nombres 40 %, Géométrie 30 %, Grandeurs 15 %, Traitement de données 15 %
  maths: { "Nombres": 3, "Algèbre": 4, "Géométrie": 5, "Grandeurs": 3, "Traitement de données": 3, "Justifier": 2 },

};
const store = {
  get(k, d) { try { const v = localStorage.getItem("ce1d:" + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("ce1d:" + k, JSON.stringify(v)); } catch (e) {} },

};
function prepare(q, subject, theme, id) {

  if (q.type === "multi") { const order = shuffle(q.options.map((_, i) => i)); q.options = order.map(i => q.options[i]); q.answers = q.answers.map(a => order.indexOf(a)); }
  if (q.type === "match") { q.items = shuffle(q.items); q.choices = [...new Set(q.choices)]; if (q.choices.length > 3 && !q.choices.every(c => /^\d+$/.test(c))) q.choices = shuffle(q.choices); }

    if (q.keepOpts || u.options.length <= 2) return u;
    const order = shuffle(u.options.map((_, i) => i)); return { q: u.q, options: order.map(i => u.options[i]), answer: order.indexOf(u.answer) };
  });

}
function buildExam(subject, length) {
  const seen = new Set(store.get("seen", []));
  const subs = subject === "tout" ? ["maths", "sciences", "francais", "neerlandais"] : subject === "mixte" ? ["maths", "sciences"] : [subject];
  const factor = (subject === "tout" ? 0.35 : subject === "mixte" ? 0.5 : 1) * (length === "court" ? 0.5 : 1);
  const qs = [];
  subs.forEach(sb => {
    Object.entries(QUOTAS[sb]).forEach(([theme, n]) => {
      const k = Math.max(1, Math.round(n * factor));
      const gens = shuffle(G.filter(g => g.subject === sb && g.theme === theme)).map(g => ({ kind: "g", g }));
      const stat = S.filter(s => s.subject === sb && s.theme === theme);
      const fresh = shuffle(stat.filter(s => !seen.has(s.id))), old = shuffle(stat.filter(s => seen.has(s.id)));
      // on alterne générateurs (nombres nouveaux) et questions fixes jamais vues
      const pool = []; const A = gens.slice(), B = fresh.map(s => ({ kind: "s", s })), C = old.map(s => ({ kind: "s", s }));
      while (A.length || B.length) { if (A.length) pool.push(A.shift()); if (B.length) pool.push(B.shift()); }
      pool.push(...C);
      const chosen = pool.slice(0, k); let gi = 0;
      while (chosen.length < k && gens.length) chosen.push(gens[gi++ % gens.length]);
      chosen.forEach(p => {
        if (p.kind === "g") qs.push(prepare(p.g.make(), sb, theme, gid("g")));
        else { qs.push(prepare(p.s.q, sb, theme, p.s.id)); seen.add(p.s.id); }

  store.set("seen", arr);

  const ordered = []; subs.forEach(sb => { const part = qs.filter(q => q.subject === sb); ordered.push(...shuffle(part.filter(q => q.type !== "open" && q.audio)), ...shuffle(part.filter(q => q.type !== "open" && !q.audio)), ...part.filter(q => q.type === "open")); });
  return { id: gid("ex"), subject, length, started: Date.now(), questions: ordered, answers: {}, idx: 0, finished: null, grading: {}, plays: {} };
}

/* ============ correction ============ */
const half = x => Math.round(x * 2) / 2;
function isAnswered(q, v) {
  if (v == null) return false;
  if (q.type === "qcm") return v !== undefined && v !== null;
  if (q.type === "multi") return v.length > 0;
  if (q.type === "num") return v.some(x => String(x || "").trim());
  if (q.type === "match") return v.some(x => x);
  if (q.type === "order") return !!v.touched;
  if (q.type === "open") return String(v).trim().length > 0;
  if (q.type === "quiz") return Array.isArray(v) && v.some(x => x != null);
  return false;
}
function gradeAuto(q, v) {
  const P = q.pts;

  if (q.type === "multi") { const sel = v || []; const good = sel.filter(i => q.answers.includes(i)).length, bad = sel.length - good; return { pts: half(Math.max(0, (good - bad) / q.answers.length) * P) }; }

  if (q.type === "match") { const oks = q.items.map((it, i) => (v || [])[i] === it.answer); return { pts: half(oks.filter(Boolean).length / oks.length * P), oks }; }
  if (q.type === "quiz") { const oks = q.subs.map((u, i) => (v || [])[i] === u.answer); return { pts: half(oks.filter(Boolean).length / oks.length * P), oks }; }
  if (q.type === "order") { const ord = (v && v.order) || q.start; const oks = ord.map((x, i) => x === i); const all = oks.every(Boolean); return { pts: all ? P : half(oks.filter(Boolean).length / oks.length * P * 0.6), oks }; }
  return { pts: 0 };
}
function qPoints(ex, q) {
  if (q.type !== "open") return gradeAuto(q, ex.answers[q.id]).pts;
  const g = ex.grading[q.id]; return g && typeof g.pts === "number" ? g.pts : 0;
}
function totals(ex) {
  let got = 0, max = 0; const th = {};
  ex.questions.forEach(q => { const p = qPoints(ex, q); got += p; max += q.pts; const t = th[q.theme] || (th[q.theme] = { got: 0, max: 0, subject: q.subject }); t.got += p; t.max += q.pts; });
  return { got, max, th };
}

/* ============ capacité IA (correction des réponses rédigées) ============ */
let sampleFn; // undefined = pas encore su, null = indisponible
const sampleReady = new Promise(res => {

${JSON.stringify(list, null, 1)}`;
